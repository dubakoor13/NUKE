name: NERVA actual externally driven fission-neutron branching (cold core)

on:
  pull_request:
    paths:
      - '.github/workflows/nerva-source-driven-fission.yml'
      - 'ntr/nerva/fixed_source_fission_branching.py'
      - 'ntr/nerva/run_fixed_source_fission_branching.py'
      - 'ntr/nerva/validate_fixed_source_fission_branching.py'
      - 'ntr/nerva/fixed_source_spatial_response.py'
      - 'ntr/nerva/validate_fixed_source_spatial_response.py'
      - 'ntr/nerva/real_core_neutron_energy_closure.py'
      - 'ntr/nerva/validate_real_core_neutron_energy_closure.py'
      - 'ntr/nerva/real_neutron_energy_tail_attribution.py'
      - 'ntr/nerva/validate_real_neutron_energy_tail_attribution.py'
      - 'ntr/nerva/real_neutron_tail_replica_statistics.py'
      - 'ntr/nerva/validate_real_neutron_tail_replica_statistics.py'
      - 'ntr/nerva/run_fixed_source_core.py'
      - 'ntr/nerva/fixed_source_core_physics.py'
      - 'ntr/nerva/model.py'
      - 'ntr/nerva/tallies.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  genuine-branching:
    name: Independent four-seed non-eigenvalue fission neutron balance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Obtain official real OpenMC 0.15.3 and evaluated NNDC nuclear data
        run: docker pull openmc/openmc:v0.15.3
      - name: Execute both actual nonbranching and fission-daughter neutron transport modes
        run: |
          set -euo pipefail
          mkdir -p build/nerva_fission_branching
          docker run --rm --cpus=2 --memory=6g \
            -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert openmc.__version__ == \"0.15.3\"; assert not openmc.__file__.startswith(\"/repo/\")"
              openmc --version
              test -f "$OPENMC_CROSS_SECTIONS"
              python -m ntr.nerva.validate_fixed_source_core_physics
              python -m ntr.nerva.validate_fixed_source_fission_branching
              python -m ntr.nerva.validate_fixed_source_spatial_response
              python -m ntr.nerva.validate_real_core_neutron_energy_closure
              python -m ntr.nerva.validate_real_neutron_energy_tail_attribution
              python -m ntr.nerva.validate_real_neutron_tail_replica_statistics
              python -m ntr.nerva.run_fixed_source_fission_branching \
                --seeds 13007 23011 33013 43019 \
                --particles 3000 --batches 30 \
                --output /repo/build/nerva_fission_branching
              # Explicitly score energies below 1e-5 eV and above 20 MeV,
              # not just the legacy incident-energy window. Attribute
              # any measurable material reaction-score imbalance to actual
              # scored tails, or report it unresolved without guessing.
              python -m ntr.nerva.real_neutron_energy_tail_attribution \
                --root /repo/build/nerva_fission_branching \
                --output /repo/build/nerva_fission_branching/real_neutron_energy_tail_attribution.json
              python -m ntr.nerva.real_neutron_tail_replica_statistics \
                --input /repo/build/nerva_fission_branching/real_neutron_energy_tail_attribution.json \
                --output /repo/build/nerva_fission_branching/real_neutron_tail_replica_statistics.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_fission_branching/real_neutron_tail_replica_statistics.json\")); assert p[\"native_hdf5_statepoints\"]==8 and p[\"independent_seed_pairs\"]==4; assert p[\"individually_distinct_statepoint_sha256_count\"]==8; assert p[\"geometry_materials_and_tallies_byte_identical_across_all_eight\"]; assert not p[\"eigenvalue_or_fission_source_convergence_validated\"]; assert not p[\"nasa_historical_nerva_validated\"]; print(\"REAL OpenMC independent-seed energy-tail uncertainty: audited without claiming hot-core qualification\")"
              python -c "import json; p=json.load(open(\"/repo/build/nerva_fission_branching/real_neutron_energy_tail_attribution.json\")); assert p[\"native_hdf5_statepoint_count\"]==8; assert p[\"independent_seed_pairs\"]==4; assert p[\"all_actual_material_energy_partitions_numerically_conserved\"]; assert p[\"all_measured_nonroundoff_legacy_residuals_accounted_for_by_scored_tails\"]; assert not p[\"hot_nuclear_data_physically_qualified\"]; assert all(r[mode][\"independent_window_partition_conserved\"] for r in p[\"per_seed\"] for mode in (\"off\",\"on\")); print(\"REAL OpenMC independently scored neutron underflow/middle/overflow: audited without forcing energy-window closure\")"
              python -m ntr.nerva.real_core_neutron_energy_closure \
                --root /repo/build/nerva_fission_branching \
                --output /repo/build/nerva_fission_branching/real_core_neutron_energy_closure.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_fission_branching/real_core_neutron_energy_closure.json\")); assert p[\"genuine_statepoint_count\"]==8; assert p[\"independent_seed_pairs\"]==4; assert p[\"material_energy_unfiltered_and_3d_spatial_integral_closure\"]; assert p[\"spectral_range_not_assumed_to_be_exhaustive\"]; assert p[\"maximum_observed_unassigned_material_score_fraction\"]<1e-5; assert all(r[mode][\"exact_energy_window_coverage_demonstrated\"] == (len(r[mode][\"observed_out_of_window_or_nonroundoff_score_residuals\"])==0) for r in p[\"per_seed\"] for mode in (\"off\",\"on\")); assert not p[\"nuclear_heating_physically_qualified\"]; assert not p[\"criticality_or_source_stationarity_validated\"]; print(\"REAL energy-resolved material neutron reaction and tracklength conservation: PASS\")"
              python -m ntr.nerva.fixed_source_spatial_response \
                --root /repo/build/nerva_fission_branching \
                --output /repo/build/nerva_fission_branching/real_spatial_neutron_response.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_fission_branching/real_spatial_neutron_response.json\")); assert p[\"real_hdf5_statepoints\"]==8; assert p[\"independent_seed_pairs\"]==4; assert p[\"real_whole_core_axial_and_3d_flux_fission_nufission_conserved\"]; assert p[\"physically_identical_geometry_materials_tallies\"]; assert not p[\"criticality_or_eigenvalue_source_stationarity_validated\"]; assert all(0 <= item[mode][\"scores\"][\"nu-fission\"][\"relative_mesh_integral_error\"] < 1e-8 for item in p[\"seeds\"] for mode in (\"fission_on\", \"fission_off\")); print(\"Real source-driven core 3D/axial flux, fission and nu-fission spatial conservation: PASS\")"
              python -c "import json; p=json.load(open(\"/repo/build/nerva_fission_branching/real_source_driven_fission_multiplication_validation.json\")); assert p[\"independent_seed_count\"]==4; assert p[\"mean_fission_daughter_neutrons_per_external_source\"]>0; assert p[\"four_seed_analog_whole_core_neutron_conservation_verified\"]; assert all(x[\"fission_daughters_enabled\"][\"absolute_balance_residual\"]<1e-6 for x in p[\"seed_modes\"]); assert not p[\"reactor_criticality_or_power_normalization_qualified\"]; print(\"Real fission-on and fission-off neutron source conservation: PASS; criticality NOT inferred\")"
            '
      - name: Retain real OpenMC statepoints, physical XML, source-balance metrics and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-actual-fission-branching-four-seed-evidence
          path: build/nerva_fission_branching/
          if-no-files-found: warn
          retention-days: 14
