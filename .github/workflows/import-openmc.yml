name: Import OpenMC upstream

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NUKE
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone OpenMC develop
        run: |
          git clone --depth 1 --branch develop https://github.com/openmc-dev/openmc.git /tmp/openmc
          cd /tmp/openmc
          git rev-parse HEAD > /tmp/openmc-upstream-sha

      - name: Replace repository contents with OpenMC snapshot
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/openmc/ ./

          UPSTREAM_SHA="$(cat /tmp/openmc-upstream-sha)"
          {
            echo "# Upstream provenance"
            echo
            echo "This repository contains a snapshot of the public OpenMC repository."
            echo
            echo "- Upstream repository: https://github.com/openmc-dev/openmc"
            echo "- Upstream branch: develop"
            echo "- Imported commit: ${UPSTREAM_SHA}"
            echo "- License: MIT (see LICENSE)"
            echo
            echo "OpenMC's original copyright, license, citation, and source files are retained."
          } > UPSTREAM.md

      - name: Commit full snapshot except upstream workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import OpenMC develop snapshot"
          git push origin HEAD:main
