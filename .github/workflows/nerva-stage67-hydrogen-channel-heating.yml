name: NUKE Stage67 OpenMC 19-channel hydrogen nuclear heating

on:
  push:
    paths:
      - 'ntr/nerva/tallies.py'
      - 'ntr/nerva/openmc_native_hydrogen_channel_heating.py'
      - 'ntr/nerva/validate_stage67_hydrogen_channel_heating.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage67-hydrogen-channel-heating.yml'
  pull_request:
    paths:
      - 'ntr/nerva/tallies.py'
      - 'ntr/nerva/openmc_native_hydrogen_channel_heating.py'
      - 'ntr/nerva/validate_stage67_hydrogen_channel_heating.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage67-hydrogen-channel-heating.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-19-channel-hydrogen-energy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse and native HDF5 runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Verify H2 cell identity, energy and all Stage52-66 numerical regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage67_hydrogen_channel_heating -v
          python -m unittest ntr.nerva.validate_stage66_direct_hydrogen_deposition -v
          python -m unittest ntr.nerva.validate_stage65_coupled_nuclear_heating -v
          python -m unittest ntr.nerva.validate_stage64_native_mesh_order -v
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Demonstrate channel-selective deposited nuclear energy and no duplicate wall watts
        run: |
          python - <<'PY'
          import tempfile
          import numpy as np
          from pathlib import Path
          from ntr.nerva.validate_stage67_hydrogen_channel_heating import fixture,parse
          from ntr.nerva.validate_stage58_fuel_hydrogen_coupling import coupled,initial,solve
          m=coupled(film=0.,nz=4,nx=20,ny=24)
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'synthetic_native.h5'
              fixture(p,m,photon=True,channel=8,source_index=2)
              mapped=parse(p,m)
              output=solve(m,initial(m,tf=400.,th=400.),dt=1e-5,
                           hydrogen_deposition_w=mapped.deposition_w)
              print('Stage67 native H2 channel IDs:',len(mapped.source_channel_ids))
              print('Stage67 axial H2 watts, selected channel 9:',
                    mapped.deposition_w[:,8].tolist())
              print('Stage67 H2 neutron deposition [W]:',
                    mapped.neutron_deposition_w.sum())
              print('Stage67 H2 photon deposition [W]:',
                    mapped.photon_deposition_w.sum())
              print('Stage67 direct H2 nuclear energy [J]:',
                    output.hydrogen_deposition_j)
              print('Stage67 fuel/H2 internal wall heat [J]:',
                    output.wall_heat_to_hydrogen_j.sum())
              print('Stage67 global first-law residual [J]:',
                    output.first_law_residual_j)
              print('Stage67 scores SYNTHETIC, source rate/instance unverified')
              assert np.count_nonzero(mapped.deposition_w)==1
              assert output.relative_first_law_residual<1e-8
          PY
