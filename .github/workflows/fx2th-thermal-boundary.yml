name: FX2-TH conservative neutronic-thermal boundary

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_thermal_energy.py'
      - 'ntr/nerva/fx2th_thermal_feedback.py'
      - 'ntr/nerva/validate_fx2th_thermal_feedback.py'
      - '.github/workflows/fx2th-thermal-boundary.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_thermal_energy.py'
      - 'ntr/nerva/fx2th_thermal_feedback.py'
      - 'ntr/nerva/validate_fx2th_thermal_feedback.py'
      - '.github/workflows/fx2th-thermal-boundary.yml'

permissions:
  contents: read

jobs:
  physical-conservation-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sparse numerics libraries
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Verify precursor and neutron spatial ODE
        run: python -m ntr.nerva.validate_fx2th_family_spacetime
      - name: Verify first-law solid/hydrogen conservation and feedback closure
        run: python -m ntr.nerva.validate_fx2th_thermal_feedback
