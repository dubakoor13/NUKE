name: NUKE Stage64 native OpenMC mesh bin order and spatial fuel heating

on:
  push:
    paths:
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - 'ntr/nerva/openmc_native_spatial_fuel_heating.py'
      - 'ntr/nerva/validate_stage60_native_hdf5_heating.py'
      - 'ntr/nerva/validate_stage64_native_mesh_order.py'
      - '.github/workflows/nerva-stage64-openmc-native-mesh-order.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  pull_request:
    paths:
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - 'ntr/nerva/openmc_native_spatial_fuel_heating.py'
      - 'ntr/nerva/validate_stage60_native_hdf5_heating.py'
      - 'ntr/nerva/validate_stage64_native_mesh_order.py'
      - '.github/workflows/nerva-stage64-openmc-native-mesh-order.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-indexed-nuclear-heat-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HDF5 sparse numerical runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Verify real C++ mesh order and Stage52-63 regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage64_native_mesh_order -v
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Independent x-fastest single-voxel heating diagnostics
        run: |
          python - <<'PY'
          import numpy as np
          from ntr.nerva.validate_stage64_native_mesh_order import read_hot_voxel
          from ntr.nerva.validate_stage58_fuel_hydrogen_coupling import coupled
          from ntr.nerva.openmc_native_spatial_fuel_heating import project_native_3d_fuel_heating
          m=coupled(film=0.,nz=4,nx=20,ny=24)
          native=read_hot_voxel(one_element=m,i=1,j=1,k=2)
          resolved=project_native_3d_fuel_heating(
              m.config,native,m.solid,isolated_element_geometry_confirmed=True)
          w=resolved.resolved.fuel_deposition_w
          print('Stage64 native OpenMC C++ flattened mesh index for (1,1,2): 15')
          print('Stage64 fuel heating of each axial slab [W]:',w.sum(axis=1).tolist())
          print('Stage64 physical volume weighted heat sum [W]:',w.sum())
          print('Stage64 global 3D heating mapping residual [W]:',
                resolved.resolved.fuel_power_balance_residual_w)
          print('Stage64 source data are SYNTHETIC, not real transport validation')
          assert np.allclose(w.sum(axis=1),[0,0,7e18*1.602176634e-19,0],atol=1e-11)
          PY
