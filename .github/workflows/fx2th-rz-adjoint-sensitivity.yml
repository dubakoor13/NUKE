name: FX2-TH adjoint r-z eigen sensitivity numerics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_rz_adjoint_sensitivity.py'
      - 'ntr/nerva/validate_fx2th_rz_adjoint_sensitivity.py'
      - '.github/workflows/fx2th-rz-adjoint-sensitivity.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_rz_adjoint_sensitivity.py'
      - 'ntr/nerva/validate_fx2th_rz_adjoint_sensitivity.py'
      - '.github/workflows/fx2th-rz-adjoint-sensitivity.yml'

permissions:
  contents: read

jobs:
  adjoint-neutronic-material-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Verify general full-family forward and adjoint eigenphysics
        run: python -m ntr.nerva.validate_fx2th_full_family_fission_eigen
      - name: Verify analytical r-z adjoint material sensitivities
        run: python -m ntr.nerva.validate_fx2th_rz_adjoint_sensitivity
