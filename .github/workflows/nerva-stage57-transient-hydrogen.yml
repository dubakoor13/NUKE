name: NUKE Stage57 conservative transient hydrogen FVM

on:
  push:
    paths:
      - 'ntr/nerva/hydrogen_transient_fvm.py'
      - 'ntr/nerva/validate_stage57_hydrogen_transient.py'
      - '.github/workflows/nerva-stage57-transient-hydrogen.yml'
  pull_request:
    paths:
      - 'ntr/nerva/hydrogen_transient_fvm.py'
      - 'ntr/nerva/validate_stage57_hydrogen_transient.py'
      - '.github/workflows/nerva-stage57-transient-hydrogen.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conservative-mass-momentum-energy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Verify transient conservative hydrogen and preceding core physics
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Conservative transient pressure-wave diagnostics
        run: |
          python - <<'PY'
          import numpy as np
          from ntr.nerva.validate_stage57_hydrogen_transient import model
          from ntr.nerva.hydrogen_transient_fvm import (
              make_state, advance_transient_hydrogen, primitive)
          m=model(24)
          p=np.full((24,19),3.e6)
          p[:12,:]*=1.002
          state=make_state(m,pressure_pa=p,temperature_k=400.)
          result=advance_transient_hydrogen(m,state,dt_s=1.e-6)
          current=primitive(m,result.state)
          print('Stage57 original hydrogen channels:',19)
          print('Stage57 axial control volumes:',m.nzone)
          print('Stage57 conserved variables per control volume:',3)
          print('Stage57 maximum CFL:',result.maximum_cfl_used)
          print('Stage57 maximum local velocity [m/s]:',
                np.max(np.abs(current.velocity_m_s)))
          print('Stage57 mass balance residual [kg]:',
                result.mass_balance_residual_kg)
          print('Stage57 momentum balance residual [N s]:',
                result.momentum_balance_residual_kg_m_s)
          print('Stage57 total energy balance residual [J]:',
                result.energy_balance_residual_j)
          print('Stage57 ideal EOS and all H2 property tables are SYNTHETIC')
          assert abs(result.mass_balance_residual_kg)<1e-13
          assert abs(result.momentum_balance_residual_kg_m_s)<1e-9
          assert abs(result.energy_balance_residual_j)<1e-7
          PY
