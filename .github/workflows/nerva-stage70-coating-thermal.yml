name: NUKE Stage70 resolved fuel coating hydrogen transient conservation

on:
  push:
    paths:
      - 'ntr/nerva/resolved_coating_thermal.py'
      - 'ntr/nerva/fuel_hydrogen_coupled_transient.py'
      - 'ntr/nerva/validate_stage70_resolved_coating.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage70-coating-thermal.yml'
  pull_request:
    paths:
      - 'ntr/nerva/resolved_coating_thermal.py'
      - 'ntr/nerva/fuel_hydrogen_coupled_transient.py'
      - 'ntr/nerva/validate_stage70_resolved_coating.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage70-coating-thermal.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuel-coating-hydrogen-enthalpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and HDF5 runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Test Stage70 and Stage52-69 conservative regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage70_resolved_coating -v
          python -m unittest ntr.nerva.validate_stage69_structural_enthalpy -v
          python -m unittest ntr.nerva.validate_stage68_full_core_energy_ledger -v
          python -m unittest ntr.nerva.validate_stage67_hydrogen_channel_heating -v
          python -m unittest ntr.nerva.validate_stage66_direct_hydrogen_deposition -v
          python -m unittest ntr.nerva.validate_stage65_coupled_nuclear_heating -v
          python -m unittest ntr.nerva.validate_stage64_native_mesh_order -v
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Report synthetic three-temperature first-law closure
        run: |
          python - <<'PY'
          import numpy as np
          from ntr.nerva.validate_stage70_resolved_coating import coating_model,coating_initial
          from ntr.nerva.validate_stage58_fuel_hydrogen_coupling import solve
          m=coating_model()
          s=coating_initial(m,tf=490.,tc=445.,th=395.)
          r=solve(m,s,dt=5e-6,
                  q=np.full_like(s.fuel_temperature_k,4.),
                  coating_deposition_w=np.full((m.nzone,19),3.),
                  hydrogen_deposition_w=np.full((m.nzone,19),5.))
          print('Stage70 resolved ZrC coating mass [kg]:',m.coating.mass_kg.sum())
          print('Stage70 nuclear fuel deposition [J]:',r.fuel_deposition_j)
          print('Stage70 nuclear coating deposition [J]:',r.coating_deposition_j)
          print('Stage70 nuclear hydrogen deposition [J]:',r.hydrogen_deposition_j)
          print('Stage70 fuel->coating internal transfer [J]:',r.fuel_to_coating_j)
          print('Stage70 coating->H2 internal transfer [J]:',r.coating_to_hydrogen_j)
          print('Stage70 coating energy change [J]:',r.coating_storage_change_j)
          print('Stage70 combined first-law residual [J]:',r.first_law_residual_j)
          print('Stage70 coating first-law residual [J]:',r.coating_first_law_residual_j)
          print('Stage70 all properties/sources SYNTHETIC; no genuine OpenMC power validation')
          assert r.relative_first_law_residual<3e-8
          assert abs(r.coating_first_law_residual_j)<8e-7
          PY
