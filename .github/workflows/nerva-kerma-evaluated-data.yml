name: NERVA actual evaluated neutron local KERMA nuclear-data coverage

on:
  pull_request:
    paths:
      - '.github/workflows/nerva-kerma-evaluated-data.yml'
      - 'ntr/nerva/audit_kerma_coverage.py'
      - 'ntr/nerva/mt901_numeric.py'
      - 'ntr/nerva/validate_kerma_coverage.py'
      - 'ntr/nerva/audit_nuclear_data_temperatures.py'
      - 'ntr/nerva/nuclear_data.py'
      - 'ntr/nerva/run_openmc_transport.py'
      - 'ntr/nerva/run_full_openmc_analysis.py'
      - 'ntr/nerva/validate_local_heating_preflight.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  neutron-local-kerma:
    name: Inspect genuine evaluated nuclide HDF5 for MT901 without inventing KERMA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Use the same OpenMC and NNDC source as the real core smoke test
        run: |
          set -euo pipefail
          mkdir -p build/nerva_evaluated_local_kerma
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' \
            > build/nerva_evaluated_local_kerma/docker_repo_digests.json

      - name: Inspect actual neutron-data files and source-specific MT901 reaction inventory
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=6g \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert not openmc.__file__.startswith(\"/repo/\")"
              test -f "$OPENMC_CROSS_SECTIONS"
              openmc --version
              python -m ntr.nerva.validate_kerma_coverage
              # Always read actual isotope HDF5, not only the MT901 index.
              # This NNDC smoke library is physically INSUFFICIENT for local
              # neutron heat: both reaction presence and numerical coverage
              # must be false for each nuclide.

              python -m ntr.nerva.audit_kerma_coverage \
                --cross-sections "$OPENMC_CROSS_SECTIONS" \
                --output /repo/build/nerva_evaluated_local_kerma/kerma_mt901_coverage.json
              python -c "import json; r=json.load(open(\"/repo/build/nerva_evaluated_local_kerma/kerma_mt901_coverage.json\")); assert not r[\"local_heating_evaluated_kerma_inventory_complete\"]; assert len(r[\"nuclides\"]) == 29; assert all(x[\"local_kerma_mt901_numerical_usable\"] is False for x in r[\"nuclides\"]); print(\"PASS: 29/29 neutron isotope MT901 numeric coefficient inventories unusable\")"

              python -m ntr.nerva.validate_local_heating_preflight
              # This same physical NNDC HDF5 inventory lacks MT901. The
              # thermal-only input gate MUST fail before any OpenMC transport,
              # while the genuine neutron-only reaction smoke test remains valid.
              if python -m ntr.nerva.run_openmc_transport \
                --cross-sections "$OPENMC_CROSS_SECTIONS" \
                --assembly core --rings 3 --export-only \
                --require-local-heating-data \
                --output /repo/build/nerva_evaluated_local_kerma/rejected_thermal_run; then
                echo "ERROR: neutron-only thermal preflight accepted missing MT901"
                exit 1
              fi
              test -s /repo/build/nerva_evaluated_local_kerma/rejected_thermal_run/local_kerma_physics_preflight.json
              grep -q "\"local_heating_evaluated_kerma_inventory_complete\": false" \
                /repo/build/nerva_evaluated_local_kerma/rejected_thermal_run/local_kerma_physics_preflight.json
              echo "PASS: actual evaluated NNDC nuclear data rejected for neutron-only reactor heat deposition"
            '

      - name: Retain actual evaluated nuclear-data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-actual-evaluated-neutron-local-kerma-inventory
          path: build/nerva_evaluated_local_kerma/
          if-no-files-found: warn
          retention-days: 21
