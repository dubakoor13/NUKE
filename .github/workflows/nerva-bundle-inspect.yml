name: NERVA bundle isolated core subset audit
on:
  push:
    paths: ['.github/workflows/nerva-bundle-inspect.yml']
  pull_request:
    paths: ['.github/workflows/nerva-bundle-inspect.yml']
permissions: {}
jobs:
  isolated-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Safely stage and verify independently selected bundle physics
        shell: python
        run: |
          import sys, os, tempfile, subprocess, zipfile, json, pathlib, stat
          from pathlib import Path
          archive=Path('NERVA-CORE-BUNDLE.zip')
          prefix='NERVA-CORE-BUNDLE/ntrv2/nerva/'
          selections=[
            'diffusion.py',
            'diffusion_2d.py',
            'validate_diffusion.py',
            'validate_diffusion_2d.py'
          ]
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit('Invalid ZIP CRC')
              with tempfile.TemporaryDirectory(prefix='nerva_bundle_') as tmp:
                  root=Path(tmp)
                  dest=root/'ntr'/'nerva'
                  dest.mkdir(parents=True)
                  (root/'ntr'/'__init__.py').write_text('')
                  allfiles=[
                    i for i in z.infolist()
                    if i.filename.startswith(prefix) and not i.is_dir()
                  ]
                  for i in allfiles:
                      relative=i.filename[len(prefix):]
                      pure=pathlib.PurePosixPath(relative)
                      if not relative or pure.is_absolute() or '..' in pure.parts or (i.external_attr>>16)&stat.S_IFMT(stat.S_IFLNK):
                          raise SystemExit('Unsafe ZIP entry '+relative)
                      # Only .py, .md and .json for read-only staged local test
                      if pure.suffix.lower() not in ('.py','.json','.md'):
                          continue
                      target=dest.joinpath(*pure.parts)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(i))
                  # Execute only allowlisted synthetic validators; no bundle scripts.
                  for name in ('validate_diffusion','validate_diffusion_2d'):
                      command=[sys.executable,'-m','ntr.nerva.'+name]
                      env=os.environ.copy()
                      env['PYTHONPATH']=str(root)
                      env['PYTHONDONTWRITEBYTECODE']='1'
                      p=subprocess.run(command,cwd=str(root),env=env,stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,text=True,timeout=90)
                      print('SELECTED_TEST',name,'exit_code',p.returncode)
                      print(p.stdout[-6500:])
                      if p.returncode:
                          raise SystemExit('Selected diffusion validation failed: '+name)
                  for name in selections:
                      data=z.read(prefix+name).decode('utf-8')
                      print('BUNDLE_SELECTED_SOURCE_JSON:'+json.dumps({'path':name,'source':data},ensure_ascii=True))
          print('ISOLATED_NUMERICS_SUCCESS')
