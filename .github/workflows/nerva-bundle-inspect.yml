name: NERVA core bundle safe inventory
on:
  push:
    paths:
      - '.github/workflows/nerva-bundle-inspect.yml'
  pull_request:
    paths:
      - '.github/workflows/nerva-bundle-inspect.yml'
jobs:
  archive-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare bundle hashes with main and preview physics audit (no execution)
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, collections
          print('BUNDLE_COMPARE_START')
          root=Path('.').resolve()
          with ZipFile('NERVA-CORE-BUNDLE.zip') as z:
              bad=z.testzip()
              print('zip_crc_first_error:',bad)
              files=[x for x in z.infolist() if not x.is_dir()]
              names=[x.filename for x in files]
              print('duplicate_names:',len(names)-len(set(names)))
              print('unsafe_paths:',[n for n in names if n.startswith('/') or '..' in Path(n).parts][:20])
              rootdir='NERVA-CORE-BUNDLE/ntrv2/nerva/'
              present=[];new=[];changed=[]
              for f in files:
                  if not f.filename.startswith(rootdir):continue
                  localpath=Path('ntr/nerva')/f.filename[len(rootdir):]
                  if not localpath.exists():
                      new.append(str(localpath))
                  elif not localpath.is_file():
                      changed.append((str(localpath),'target-not-file'))
                  else:
                      sig=hashlib.sha256(z.read(f)).digest()
                      target=hashlib.file_digest(open(localpath,'rb'),'sha256').digest()
                      if sig==target:present.append(str(localpath))
                      else:changed.append((str(localpath),'content-differs'))
              print('source_exact_match:',len(present),'missing_from_main:',len(new),'content_differs:',len(changed))
              print('new_paths:',json.dumps(new[:130]))
              print('different_paths:',json.dumps(changed[:130]))
              for member in [
                'NERVA-CORE-BUNDLE/manifest_new_files.json',
                'NERVA-CORE-BUNDLE/RUNBOOK.md',
                'NERVA-CORE-BUNDLE/audit/NERVA_OFFLINE_AUDIT.md',
                'NERVA-CORE-BUNDLE/requirements.txt',
                'NERVA-CORE-BUNDLE/ntrv2/nerva/diffusion_2d.py',
                'NERVA-CORE-BUNDLE/ntrv2/nerva/transport_backend.py',
                'NERVA-CORE-BUNDLE/ntrv2/nerva/acceptance_gates.py'
              ]:
                  print('### MEMBER:',member)
                  try:
                      raw=z.read(member)
                      limit=9500 if member.endswith(('.md','.json')) else 3000
                      print(raw[:limit].decode('utf-8',errors='replace'))
                  except KeyError:
                      print('MISSING')
                  print('### END_MEMBER')
          print('BUNDLE_COMPARE_END')
