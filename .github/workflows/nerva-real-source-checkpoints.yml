name: NERVA genuine 20-checkpoint OpenMC fission source drift

on:
  push:
    paths:
      - 'ntr/nerva/real_source_checkpoint_drift.py'
      - 'ntr/nerva/validate_real_source_checkpoint_drift.py'
      - '.github/workflows/nerva-real-source-checkpoints.yml'
  pull_request:
    paths:
      - 'ntr/nerva/real_source_checkpoint_drift.py'
      - 'ntr/nerva/validate_real_source_checkpoint_drift.py'
      - '.github/workflows/nerva-real-source-checkpoints.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independently-audit-native-openmc-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HDF5 and numerical readers
        run: python -m pip install 'numpy>=1.26' 'h5py>=3.10'
      - name: Download actual October 23 OpenMC four-seed evidence (no synthetic fallback)
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          mkdir -p build/real_source_checkpoints
          curl -fLSs --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dubakoor13/NUKE/actions/artifacts/12492499186/zip" \
            -o build/real_source_checkpoints/source_openmc.zip
          echo "cf05ab907bee76b198d3dc4736a84c6d560f3a8c2d753b78b5605c4826e53274  build/real_source_checkpoints/source_openmc.zip" | sha256sum -c -
      - name: Verify source-bank observations using 20 native OpenMC HDF5 checkpoints
        run: |
          python -m ntr.nerva.real_source_checkpoint_drift \
            build/real_source_checkpoints/source_openmc.zip \
            --output build/real_source_checkpoints/native_source_audit.json
      - name: Real-source HDF5 and tampering regression tests
        env:
          NUKE_REAL_CORE_EVIDENCE_PATH: build/real_source_checkpoints/source_openmc.zip
        run: python -m ntr.nerva.validate_real_source_checkpoint_drift
      - name: Upload compact native source observation report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage22-real-source-checkpoint-observations
          path: build/real_source_checkpoints/native_source_audit.json
          if-no-files-found: warn
