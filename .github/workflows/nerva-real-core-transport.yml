name: NERVA actual OpenMC neutron transport (core only)

on:
  pull_request:
    paths:
      - '.github/workflows/nerva-real-core-transport.yml'
      - 'ntr/nerva/run_real_core_replicas.py'
      - 'ntr/nerva/validate_real_core_replicas_statistics.py'
      - 'ntr/nerva/source_bank_convergence.py'
      - 'ntr/nerva/source_bank_trajectory.py'
      - 'ntr/nerva/source_resolution_audit.py'
      - 'ntr/nerva/real_core_keff_history_qualification.py'
      - 'ntr/nerva/core_criticality_physical_qualification.py'
      - 'ntr/nerva/validate_core_criticality_physical_qualification.py'
      - 'ntr/nerva/validate_real_core_keff_history_qualification.py'
      - 'ntr/nerva/source_energy_audit.py'
      - 'ntr/nerva/source_phase_space_audit.py'
      - 'ntr/nerva/source_direction_physics_audit.py'
      - 'ntr/nerva/source_clone_moment_closure.py'
      - 'ntr/nerva/validate_source_clone_moment_closure.py'
      - 'ntr/nerva/validate_source_direction_physics_audit.py'
      - 'ntr/nerva/core_reaction_ensemble.py'
      - 'ntr/nerva/core_reaction_history.py'
      - 'ntr/nerva/core_reaction_estimator_agreement.py'
      - 'ntr/nerva/core_neutron_leakage_history.py'
      - 'ntr/nerva/core_neutron_economy_validation.py'
      - 'ntr/nerva/neutron_economy_uncertainty.py'
      - 'ntr/nerva/validate_neutron_economy_uncertainty.py'
      - 'ntr/nerva/validate_core_neutron_economy_validation.py'
      - 'ntr/nerva/core_fission_yield_energy.py'
      - 'ntr/nerva/core_material_temperature_qualification.py'
      - 'ntr/nerva/audit_nuclear_data_temperatures.py'
      - 'ntr/nerva/validate_nuclear_data.py'
      - 'ntr/nerva/validate_core_material_temperature_qualification.py'
      - 'ntr/nerva/validate_core_fission_yield_energy.py'
      - 'ntr/nerva/validate_core_neutron_leakage_history.py'
      - 'ntr/nerva/validate_core_reaction_estimator_agreement.py'
      - 'ntr/nerva/validate_core_reaction_history.py'
      - 'ntr/nerva/validate_core_reaction_ensemble.py'
      - 'ntr/nerva/validate_source_phase_space_audit.py'
      - 'ntr/nerva/validate_source_energy_audit.py'
      - 'ntr/nerva/heating_data_qualification.py'
      - 'ntr/nerva/executed_material_kerma_qualification.py'
      - 'ntr/nerva/real_core_material_transport_support.py'
      - 'ntr/nerva/validate_real_core_material_transport_support.py'
      - 'ntr/nerva/validate_executed_material_kerma_qualification.py'
      - 'ntr/nerva/audit_kerma_coverage.py'
      - 'ntr/nerva/mt901_numeric.py'
      - 'ntr/nerva/validate_heating_data_qualification.py'
      - 'ntr/nerva/validate_source_resolution_audit.py'
      - 'ntr/nerva/validate_source_bank_trajectory.py'
      - 'ntr/nerva/validate_source_bank_convergence.py'
      - 'ntr/nerva/model.py'
      - 'ntr/nerva/run_openmc_transport.py'
      - 'ntr/nerva/statepoint_content_audit.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  real-core-four-seed-smoke:
    name: Executed four-seed NERVA-derived core eigenvalue transport
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Pull official OpenMC executable with its NNDC test-data archive
        run: |
          set -euo pipefail
          mkdir -p build/nerva_real_core
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' \
            | tee build/nerva_real_core/docker_image_repo_digest.json
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{.Id}}' \
            | tee build/nerva_real_core/docker_image_id.txt

      - name: Execute OpenMC C++ neutron transport on four independent seeds
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=2 --memory=6g \
            -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              # The NUKE checkout contains a separate /repo/openmc source tree.
              # It must NEVER shadow the installed Docker OpenMC Python
              # bindings and their libopenmc.so. Run outside the checkout,
              # prepend Docker site-packages, and import NUKE via /repo.
              cd /tmp
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; print(\"Installed OpenMC module:\", openmc.__file__); assert not openmc.__file__.startswith(\"/repo/\")"
              echo "Executable: $(command -v openmc)"
              openmc --version
              python --version
              python -c "import openmc; print(\"OpenMC Python:\", openmc.__version__)"
              test -f "$OPENMC_CROSS_SECTIONS"
              echo "Evaluated neutron library: $OPENMC_CROSS_SECTIONS"
              python -m ntr.nerva.validate_real_core_replicas_statistics
              python -m ntr.nerva.validate_source_direction_physics_audit
              python -m ntr.nerva.validate_source_clone_moment_closure
              python -m ntr.nerva.validate_source_bank_convergence
              python -m ntr.nerva.validate_source_bank_trajectory
              python -m ntr.nerva.validate_real_core_keff_history_qualification
              python -m ntr.nerva.validate_core_criticality_physical_qualification
              python -m ntr.nerva.validate_source_resolution_audit
              python -m ntr.nerva.validate_source_energy_audit
              python -m ntr.nerva.validate_source_phase_space_audit
              python -m ntr.nerva.validate_core_reaction_ensemble
              python -m ntr.nerva.validate_core_reaction_history
              python -m ntr.nerva.validate_core_reaction_estimator_agreement
              python -m ntr.nerva.validate_core_neutron_leakage_history
              python -m ntr.nerva.validate_core_neutron_economy_validation
              python -m ntr.nerva.validate_neutron_economy_uncertainty
              python -m ntr.nerva.validate_core_fission_yield_energy
              python -m ntr.nerva.validate_nuclear_data
              python -m ntr.nerva.validate_core_material_temperature_qualification
              python -m ntr.nerva.validate_heating_data_qualification
              python -m ntr.nerva.validate_executed_material_kerma_qualification
              python -m ntr.nerva.validate_real_core_material_transport_support
              python -m ntr.nerva.run_real_core_replicas \
                --rings 3 --particles 3000 --batches 120 --inactive 30 \
                --source-bank-batches 40 60 80 100 120 \
                --hydrogen-temperature-k 293.6059129982851 \
                --seeds 13007 23011 33013 43019 \
                --output /repo/build/nerva_real_core
              python -m ntr.nerva.source_direction_physics_audit \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/source_direction_physics_audit.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/source_direction_physics_audit.json\")); assert p[\"actual_independent_seed_count\"]==4; assert not p[\"fission_source_stationarity_demonstrated\"]; assert p[\"source_direction_vectors_unit_normalized\"]; assert p[\"smallest_effective_position_fraction\"]<0.05; print(\"Real OpenMC source: directional vectors physical, fission-source cloning still blocks stationarity\")"
              python -m ntr.nerva.source_clone_moment_closure \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --source-direction /repo/build/nerva_real_core/source_direction_physics_audit.json \
                --output /repo/build/nerva_real_core/source_clone_moment_closure.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/source_clone_moment_closure.json\")); assert p[\"independent_seed_count\"] == 4; assert p[\"all_20_real_checkpoint_moment_partitions_closed\"]; assert not p[\"cloned_source_sites_are_independent_neutron_histories\"]; assert p[\"minimum_effective_source_site_fraction\"] < 0.05; print(\"Actual neutron source angular/energy moment conservation across cloned sites: PASS; source independence NOT ESTABLISHED\")"
              python -m ntr.nerva.source_resolution_audit \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/source_resolution_audit.json
              # Verify saved OpenMC source entropy and k histories are exact
              # prefixes of the same independent-seed neutron run, then
              # compute explicitly non-certifying split-chain k statistics.
              python -m ntr.nerva.real_core_keff_history_qualification \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --spatial-audit /repo/build/nerva_real_core/source_resolution_audit.json \
                --output /repo/build/nerva_real_core/real_core_keff_history_qualification.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/real_core_keff_history_qualification.json\")); assert p[\"all_checkpoint_keff_and_entropy_prefixes_verified\"]; assert p[\"four_seed_split_chain_generation_k\"][\"independent_seed_count\"]==4; assert not p[\"spatial_fission_source_stationarity_validated\"]; print(\"Real eigenvalue generation-history integrity verified; spatial source stationarity NOT ESTABLISHED\")"
              python -m ntr.nerva.core_criticality_physical_qualification \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --spatial-audit /repo/build/nerva_real_core/source_resolution_audit.json \
                --output /repo/build/nerva_real_core/core_criticality_physical_qualification.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/core_criticality_physical_qualification.json\")); assert p[\"independent_seed_count\"]==4; assert p[\"observed_state\"]==\"FAR_BELOW_CRITICAL\"; assert not p[\"cold_model_may_be_claimed_a_critical_operating_nerva_core\"]; print(\"Genuine OpenMC 4-seed cold core FAR BELOW criticality; reactor operation is physically unqualified\")"
              python -m ntr.nerva.source_energy_audit \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/source_energy_audit.json
              python -m ntr.nerva.source_phase_space_audit \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --spatial-audit /repo/build/nerva_real_core/source_resolution_audit.json \
                --energy-audit /repo/build/nerva_real_core/source_energy_audit.json \
                --output /repo/build/nerva_real_core/source_phase_space_audit.json
              python -m ntr.nerva.core_reaction_ensemble \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/core_reaction_ensemble.json
              python -m ntr.nerva.core_reaction_history \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/core_reaction_history.json
              python -m ntr.nerva.core_reaction_estimator_agreement \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/core_reaction_estimator_agreement.json
              python -m ntr.nerva.core_neutron_leakage_history \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/core_neutron_leakage_history.json
              # Physical neutron ECONOMY: actual within-generation analog
              # absorption, vacuum leakage and (n,2n) multiplicative
              # scattering, plus independently tallied NEXT-generation
              # fission source; exact 20 HDF5 checkpoint provenance.
              python -m ntr.nerva.core_neutron_economy_validation \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --leakage /repo/build/nerva_real_core/core_neutron_leakage_history.json \
                --reactions /repo/build/nerva_real_core/core_reaction_history.json \
                --ensemble /repo/build/nerva_real_core/core_reaction_ensemble.json \
                --criticality /repo/build/nerva_real_core/core_criticality_physical_qualification.json \
                --output /repo/build/nerva_real_core/core_neutron_economy_physical_validation.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/core_neutron_economy_physical_validation.json\")); assert p[\"saved_checkpoint_count\"]==20; assert p[\"independent_seed_count\"]==4; assert p[\"vacuum_leakage_dominates_terminal_neutron_losses\"]; assert abs(p[\"mean_per_starting_neutron\"][\"native_vacuum_leakage_per_starting_neutron\"]-1.024)<.02; assert not p[\"physically_validated_critical_nerva_core\"]; print(\"Real neutron economy verified: vacuum leakage dominates, cold reactor still noncritical\")"
              # Covariance acceptance is computed from the actual four OpenMC
              # independent-seed means; correlated eigenvalue batches are NOT
              # miscounted as independent statistical samples.
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/core_neutron_economy_physical_validation.json\")); u=p[\"correlated_independent_seed_uncertainty\"]; assert u[\"independent_seed_count\"]==p[\"independent_seed_count\"]==4; assert u[\"statistics\"]==\"FOUR_INDEPENDENT_OPENMC_SEED_MEANS_CORRELATED_NEUTRON_ECONOMY\"; assert sorted(u[\"seeds\"])==sorted(x[\"seed\"] for x in p[\"per_seed\"]); assert len(u[\"between_seed_sample_covariance\"])==6; assert u[\"maximum_absolute_per_seed_neutron_balance_residual\"]<1e-7; assert u[\"joint_neutron_balance_covariance_standard_error\"]<1e-7; assert not u[\"formal_monte_carlo_confidence_coverage_established\"]; assert not u[\"source_bank_stationarity_validated\"]; print(\"Real HDF5 four-seed correlated neutron-balance and paired-tally uncertainty: PASS; source stationarity NOT established\")"
              python -m ntr.nerva.core_fission_yield_energy \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/core_fission_yield_energy.json
              python -m ntr.nerva.core_material_temperature_qualification \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --cross-sections "$OPENMC_CROSS_SECTIONS" \
                --output /repo/build/nerva_real_core/core_material_temperature_qualification.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/core_material_temperature_qualification.json\")); assert p[\"all_real_source_model_provenance_consistent\"]; assert p[\"actual_geometry_reachability_and_evaluated_xs_reconciled\"]; assert p[\"declared_material_count\"]==9; assert p[\"actual_reachable_material_count\"]==4; assert p[\"uninstantiated_declared_material_count\"]==5; assert p[\"actual_reachable_material_ids\"]==[19,20,21,22]; assert p[\"number_of_physical_materials\"]==4; assert p[\"number_with_explicit_exported_temperature\"]==1; assert p[\"number_relying_on_implicit_temperature\"]==3; assert p[\"evaluated_neutron_nuclide_count\"]==13; assert p[\"declared_isotope_count\"]==29; assert not p[\"hot_operating_temperature_neutron_physics_qualified\"]; print(\"REAL executed core neutron-temperature qualification: 4 reachable material regions, only 1 with explicit K, 13 physically used isotopes; hot core NOT QUALIFIED\")"

              python -m ntr.nerva.heating_data_qualification \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --output /repo/build/nerva_real_core/heating_data_qualification.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/heating_data_qualification.json\")); assert p[\"all_real_statepoints_have_usable_neutron_local_heating\"] is False, \"Changed NNDC heating behavior: reevaluate data physics\"; print(\"Cold NNDC nuclear-heating support: FAIL (expected physical qualification)\")"

              # Match ACTUAL executed materials.xml from each real OpenMC seed
              # against the ACTUAL HDF5-inspected physical MT901 inventory,
              # with strict nuclear-data-library hashes and statepoint hashes.
              python -m ntr.nerva.audit_kerma_coverage \
                --cross-sections "$OPENMC_CROSS_SECTIONS" \
                --output /repo/build/nerva_real_core/evaluated_kerma_inventory.json
              python -m ntr.nerva.executed_material_kerma_qualification \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --inventory /repo/build/nerva_real_core/evaluated_kerma_inventory.json \
                --output /repo/build/nerva_real_core/executed_material_kerma_qualification.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/executed_material_kerma_qualification.json\")); assert p[\"declared_material_count\"]==9; assert p[\"physical_material_count\"]==4; assert p[\"uninstantiated_declared_material_count\"]==5; assert p[\"executed_reachable_material_ids\"]==[19,20,21,22]; assert p[\"required_executed_neutron_nuclide_count\"]==13; assert len(p[\"material_regions_without_complete_evaluated_mt901\"])==4; assert not p[\"thermal_power_normalization_allowed\"]; print(\"REAL executed OpenMC geometry: 4 of 9 declared materials, 13 active nuclides lacking evaluated local MT901\")"

              # Independently verify that REAL native HDF5 neutron
              # tracklength is positive in ALL executed materials and
              # exactly zero in every unplaced materials.xml entry,
              # across four seeds and all 20 saved source checkpoints.
              python -m ntr.nerva.real_core_material_transport_support \
                --summary /repo/build/nerva_real_core/real_core_transport_summary.json \
                --material-kerma /repo/build/nerva_real_core/executed_material_kerma_qualification.json \
                --output /repo/build/nerva_real_core/real_core_material_transport_support.json
              python -c "import json; p=json.load(open(\"/repo/build/nerva_real_core/real_core_material_transport_support.json\")); assert p[\"verified_statepoint_checkpoint_count\"]==20; assert p[\"four_independent_seed_count\"]==4; assert p[\"material_transport_support_status\"]==\"ALL_REACHABLE_SAMPLED_AND_UNPLACED_ZERO\"; assert p[\"reachable_material_ids\"]==[19,20,21,22]; assert p[\"uninstantiated_material_ids\"]==[23,24,25,26,27]; assert not p[\"local_nuclear_heat_deposition_qualified\"]; print(\"REAL neutron tracklength verifies 4 instantiated material regions, 5 unused nuclear definitions\")"


            '

      - name: Persist physical-statepoint evidence even when transport fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-real-openmc-four-seed-core-evidence
          path: build/nerva_real_core/
          if-no-files-found: warn
          retention-days: 21
