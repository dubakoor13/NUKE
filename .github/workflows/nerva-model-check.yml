name: NERVA model check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ntr/nerva/**'
      - '.github/workflows/nerva-model-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenMC Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate NERVA fuel-element geometry
        run: python -m ntr.nerva.validate_layout

      - name: Export NERVA OpenMC XML
        run: python -m ntr.nerva.build_model --output build/nerva_demo

      - name: Show exported files
        run: find build/nerva_demo -maxdepth 1 -type f -print -exec test -s {} \;
