name: NERVA model check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ntr/nerva/**'
      - '.github/workflows/nerva-model-check.yml'
  push:
    branches:
      - main
    paths:
      - 'ntr/nerva/**'
      - 'ntr/airbreathing/**'
      - '.github/workflows/nerva-model-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenMC Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate gas-phase compressor/feed/fuel/nozzle physical closure
        run: python -m ntr.nerva.validate_gas_feed_network

      - name: Run gas-phase feed-network CLI with synthetic example
        run: |
          python -m ntr.nerva.validate_gas_feed_network --write-example build/nerva_gas_feed_case.json
          test -s build/gas_feed_result.json

      - name: Validate compressible channel thermodynamics and momentum physics
        run: python -m ntr.nerva.validate_compressible_channel

      - name: Check fuel-element compressible channel CLI
        run: python -m ntr.nerva.solve_element_channels --help

      - name: Validate NERVA fuel and tie-tube geometry
        run: python -m ntr.nerva.validate_layout

      - name: Validate NERVA power normalization
        run: python -m ntr.nerva.validate_power

      - name: Validate voxelwise OpenMC core heating conservation
        run: python -m ntr.nerva.validate_heat_partition

      - name: Check statepoint postprocessor CLI
        run: python -m ntr.nerva.postprocess_statepoint --help

      - name: Validate OpenMC statepoint identity and Monte Carlo heating quality
        run: python -m ntr.nerva.validate_statepoint_quality

      - name: Validate resolved OpenMC transport feedback Picard and QA gates
        run: python -m ntr.nerva.validate_resolved_openmc_feedback

      - name: Check resolved OpenMC feedback orchestrator CLI
        run: python -m ntr.nerva.run_resolved_openmc_feedback --help

      - name: Validate OpenMC axial heating covariance and fixed-power statistics
        run: python -m ntr.nerva.validate_axial_covariance

      - name: Validate four-plus OpenMC heating ensemble uncertainty and provenance
        run: python -m ntr.nerva.validate_openmc_replica_ensemble

      - name: Check multiseed OpenMC ensemble CLI
        run: python -m ntr.nerva.run_openmc_replica_ensemble --help

      - name: Validate independent OpenMC heating replica statistics and thermal consequences
        run: python -m ntr.nerva.validate_openmc_replica_convergence

      - name: Check OpenMC independent replica comparison CLI
        run: python -m ntr.nerva.run_openmc_replica_convergence --help

      - name: Validate resolved thermal timestep convergence and conservation
        run: python -m ntr.nerva.validate_temporal_convergence

      - name: Validate channel-resolved fuel and tie-counterflow transients
        run: python -m ntr.nerva.validate_resolved_transient

      - name: Check channel-resolved thermal CLI
        run: python -m ntr.nerva.run_resolved_transient --help

      - name: Validate implicit hydrogen thermochemistry and energy integration
        run: python -m ntr.nerva.validate_implicit_hydrogen

      - name: Validate OpenMC heating to transient power/energy coupling
        run: python -m ntr.nerva.validate_openmc_transient

      - name: Check full OpenMC transient CLI
        run: python -m ntr.nerva.run_openmc_transient --help

      - name: Validate NERVA heritage transient energy conservation
        run: python -m ntr.nerva.validate_heritage_transient

      - name: Validate NERVA 1-D hydrogen fuel channel
        run: python -m ntr.nerva.validate_thermal

      - name: Check thermal coupling CLI
        run: python -m ntr.nerva.solve_thermal --help

      - name: Validate state-dependent hydrogen property backend
        run: python -m ntr.nerva.validate_hydrogen_backend

      - name: Install optional analysis dependencies
        run: python -m pip install CoolProp matplotlib

      - name: Validate subcritical two-phase hydrogen coolant HEM friction physics
        run: python -m ntr.nerva.validate_two_phase_cooling

      - name: Validate geometry-based Darcy cooling path pressure/energy physics
        run: python -m ntr.nerva.validate_geometry_regenerative

      - name: Validate parallel regenerative nozzle/reflector and tie-tube cooling hydraulics
        run: python -m ntr.nerva.validate_regenerative_cooling

      - name: Validate real-fluid cryogenic H2 tie tube boiling/counterflow energy conservation
        run: python -m ntr.nerva.validate_cryogenic_tie_enthalpy

      - name: Validate fixed-volume CoolProp H2 tie mass and internal-energy conservation
        run: python -m ntr.nerva.validate_isochoric_tie

      - name: Validate pressure-driven axial tie interface flows and mass/internal energy
        run: python -m ntr.nerva.validate_pressure_driven_tie

      - name: Validate finite-inertance tie momentum with mass/internal energy first law
        run: python -m ntr.nerva.validate_inertial_tie

      - name: Validate distributed compressible H2 tie Euler momentum and total energy
        run: python -m ntr.nerva.validate_distributed_tie_euler

      - name: Validate distributed H2 tie Euler boundaries from shaft-closed regenerative network
        run: python -m ntr.nerva.validate_distributed_tie_engine_boundary

      - name: Validate transient tie Euler and common-header two-way mass/enthalpy feedback
        run: python -m ntr.nerva.validate_dynamic_header_tie

      - name: Validate dynamic nozzle-reflector pressure-conditioned branch and tie/header conservation
        run: python -m ntr.nerva.validate_dynamic_parallel_header

      - name: Validate dual pump/header manifold mass and energy conservation
        run: python -m ntr.nerva.validate_dual_header_tie

      - name: Validate live LH2 pump head and rotor energy with dual hydrogen manifolds
        run: python -m ntr.nerva.validate_dynamic_pump_shaft

      - name: Validate live warm H2 turbine bleed admission and conservative pump rotor power
        run: python -m ntr.nerva.validate_dynamic_turbine_admission

      - name: Validate real-fluid tie heating and regenerative branch hydraulic fixed point
        run: python -m ntr.nerva.validate_cryogenic_tie_hydraulic_coupling

      - name: Validate implicit fuel/tie wall heat flux and solid inventory power ledger
        run: python -m ntr.nerva.validate_thermal_cycle_feedback

      - name: Validate resolved thermal fuel and tie flow fixed point and convergence guards
        run: python -m ntr.nerva.validate_thermal_flow_coupling

      - name: Validate reconstructed OpenMC heating to regenerative and full engine cycle
        run: python -m ntr.nerva.validate_openmc_cycle_coupling

      - name: Check OpenMC reconstructed power routing CLI arguments
        run: python -m ntr.nerva.run_turbine_bleed_cycle --help

      - name: Run regenerative cooling pump-turbine full-cycle CLI
        run: |
          python -m ntr.nerva.validate_regenerative_cooling --write-example build/regenerative_cooling_case.json
          test -s build/regenerative_cooling_result.json

      - name: Validate shaft-closed LH2 pump and warm hydrogen turbine bleed
        run: python -m ntr.nerva.validate_turbine_bleed_cycle

      - name: Run physical turbine-bleed engine-cycle CLI
        run: |
          python -m ntr.nerva.validate_turbine_bleed_cycle --write-example build/turbine_bleed_case.json
          test -s build/turbine_bleed_result.json

      - name: Validate equilibrium H2 dissociation and hot-core/nozzle energy physics
        run: python -m ntr.nerva.validate_equilibrium_hot_hydrogen

      - name: Run frozen and equilibrium H2 hot-core scenarios
        run: |
          python -m ntr.nerva.validate_equilibrium_hot_hydrogen --write-example build/equilibrium_h2_example.json
          test -s build/hot_frozen.json
          test -s build/hot_equilibrium.json

      - name: Validate cryogenic LH2 to hot NASA7 core and nozzle enthalpy bridge
        run: python -m ntr.nerva.validate_hot_lh2_cycle

      - name: Check hot NERVA LH2 fuel-nozzle cycle CLI
        run: |
          python -m ntr.nerva.validate_hot_lh2_cycle --write-example build/hot_lh2_case.json
          test -s build/hot_lh2_cycle.json

      - name: Validate cryogenic LH2 pump, vaporization, gas core and nozzle
        run: python -m ntr.nerva.validate_lh2_feed_cycle

      - name: Run CoolProp LH2 cryogenic feed operating-point CLI
        run: |
          python -m ntr.nerva.validate_lh2_feed_cycle --write-example build/lh2_cycle_case.json
          test -s build/lh2_cycle_result.json

      - name: Validate CoolProp hydrogen backend
        run: python -m ntr.nerva.validate_coolprop

      - name: Validate NERVA fuel-solid conduction estimate
        run: python -m ntr.nerva.validate_fuel_conduction

      - name: Validate NERVA tie-tube counterflow
        run: python -m ntr.nerva.validate_tie_tube

      - name: Check tie-tube thermal CLI
        run: python -m ntr.nerva.solve_tie_tube --help

      - name: Check NERVA result plotting CLI
        run: python -m ntr.nerva.plot_results --help

      - name: Check NERVA analysis orchestrator CLI
        run: python -m ntr.nerva.run_analysis --help

      - name: Validate NERVA engine performance layer
        run: python -m ntr.nerva.validate_engine_performance

      - name: Validate NASA-7 variable-property hot-hydrogen nozzle
        run: python -m ntr.nerva.validate_nasa_hydrogen

      - name: Validate engine-level mass and thrust conservation
        run: python -m ntr.nerva.validate_engine_stream_balance

      - name: Validate physics-based NERVA engine solver
        run: python -m ntr.nerva.validate_nerva_engine

      - name: Validate OpenMC exact thermal epithermal fast energy group statistics
        run: python -m ntr.nerva.validate_neutron_energy_groups

      - name: Validate expanded NERVA OpenMC diagnostics
        run: python -m ntr.nerva.validate_openmc_diagnostics

      - name: Validate NERVA fuel-sector geometry
        run: python -m ntr.nerva.validate_fuel_sectors

      - name: Validate NERVA deterministic fuel-sector areas
        run: python -m ntr.nerva.validate_fuel_sector_geometry

      - name: Validate NERVA fuel-sector thermal coupling
        run: python -m ntr.nerva.validate_sector_thermal

      - name: Validate NERVA stochastic-volume setup
        run: python -m ntr.nerva.validate_volumes

      - name: Check NERVA stochastic-volume CLI
        run: python -m ntr.nerva.calculate_volumes --help

      - name: Check NERVA instance-tally postprocessor CLI
        run: python -m ntr.nerva.postprocess_instance_tallies --help

      - name: Validate NERVA element/channel reconstruction
        run: python -m ntr.nerva.validate_element_channels

      - name: Check NERVA element/channel thermal CLI
        run: python -m ntr.nerva.solve_element_channels --help

      - name: Check NERVA element/channel plotting CLI
        run: python -m ntr.nerva.plot_element_channels --help

      - name: Validate NERVA per-tie reconstruction
        run: python -m ntr.nerva.validate_tie_instances

      - name: Validate NERVA parallel-flow balancing
        run: python -m ntr.nerva.validate_parallel_flow

      - name: Check NERVA per-tie thermal CLI
        run: python -m ntr.nerva.solve_tie_instances --help

      - name: Check NERVA per-tie plotting CLI
        run: python -m ntr.nerva.plot_tie_instances --help

      - name: Check NERVA VTK exporter CLI
        run: python -m ntr.nerva.export_vtk --help

      - name: Check NERVA run-comparison CLI
        run: python -m ntr.nerva.compare_runs --help

      - name: Validate NERVA conservative OpenMC mesh refinement projection
        run: python -m ntr.nerva.validate_mesh_refinement

      - name: Validate NERVA mesh convergence report and physical identity
        run: python -m ntr.nerva.validate_mesh_refinement_report

      - name: Validate independent-seed mesh-refinement sampling uncertainty
        run: python -m ntr.nerva.validate_mesh_refinement_statistics

      - name: Check OpenMC mesh-refinement ensemble CLI
        run: python -m ntr.nerva.run_openmc_mesh_refinement_ensemble --help

      - name: Check NERVA numerical-convergence CLI
        run: python -m ntr.nerva.summarize_convergence --help

      - name: Check NERVA uncertainty screening CLI
        run: python -m ntr.nerva.propagate_uncertainty --help

      - name: Check NERVA nuclear-data temperature audit CLI
        run: python -m ntr.nerva.audit_nuclear_data_temperatures --help

      - name: Check NERVA engineering report CLI
        run: python -m ntr.nerva.generate_run_report --help

      - name: Validate NERVA nuclear-data preflight parser
        run: python -m ntr.nerva.validate_nuclear_data

      - name: Validate evaluated MT901 temperature-resolved local KERMA numerical arrays
        run: python -m ntr.nerva.validate_kerma_coverage

      - name: Validate physical MT901 local-neutron-heating preflight wiring
        run: python -m ntr.nerva.validate_local_heating_preflight

      - name: Validate actual core material thermal physics and NASA reference distinctions
        run: python -m ntr.nerva.validate_physical_core_nuclear_data

      - name: Validate whole-core neutron conservation with (n,xn) multiplicity
        run: python -m ntr.nerva.validate_core_neutron_balance

      - name: Validate independent material, energy and global neutron reaction identities
        run: python -m ntr.nerva.validate_core_reaction_partition

      - name: Audit reference-specific NASA core geometry and composition gaps
        run: python -m ntr.nerva.physical_core_reference_validation --assembly core --rings 3 --output build/nerva_core_reference_audit.json

      - name: Validate HDF5 spatial fission-source bank time/seed statistics (synthetic)
        run: python -m ntr.nerva.validate_source_bank_convergence

      - name: Validate time-resolved actual-source-bank trajectory numerics (synthetic)
        run: python -m ntr.nerva.validate_source_bank_trajectory

      - name: Validate actual OpenMC local-heating numerical rejection of absent KERMA (synthetic)
        run: python -m ntr.nerva.validate_heating_data_qualification

      - name: Validate nested-resolution fission-source TV and site-cloning numerics (synthetic)
        run: python -m ntr.nerva.validate_source_resolution_audit

      - name: Validate real-format fission source energy drift and HDF5 integrity (synthetic)
        run: python -m ntr.nerva.validate_source_energy_audit

      - name: Validate genuine-format 4D fission source joint spatial and energy numerical identities
        run: python -m ntr.nerva.validate_source_phase_space_audit

      - name: Validate four-seed core neutron absorption and nu-fission reaction ensemble statistics
        run: python -m ntr.nerva.validate_core_reaction_ensemble

      - name: Validate genuine-format disjoint active-generation neutron reaction accounting
        run: python -m ntr.nerva.validate_core_reaction_history

      - name: Validate source-particle population sensitivity statistics and provenance
        run: python -m ntr.nerva.validate_source_population_sensitivity

      - name: Validate OpenMC correlated-source and per-batch eigenvalue numerics
        run: python -m ntr.nerva.validate_source_history_statistics

      - name: Validate OpenMC core eigenvalue and source-entropy diagnostics (synthetic)
        run: python -m ntr.nerva.validate_core_statepoint_diagnostics

      - name: Check NERVA nuclear-data preflight CLI
        run: python -m ntr.nerva.check_nuclear_data --help

      - name: Check reproducible NERVA transport runner CLI
        run: python -m ntr.nerva.run_openmc_transport --help

      - name: Check full real-data NERVA OpenMC pipeline CLI
        run: python -m ntr.nerva.run_full_openmc_analysis --help

      - name: Check NERVA analysis QA gate CLI
        run: python -m ntr.nerva.validate_analysis_outputs --help

      - name: Check NERVA OpenMC diagnostics postprocessor CLI
        run: python -m ntr.nerva.postprocess_openmc_diagnostics --help

      - name: Check NERVA OpenMC diagnostics plotting CLI
        run: python -m ntr.nerva.plot_openmc_diagnostics --help

      - name: Validate four alternative-propellant NTP cases
        run: python -m ntr.nerva.validate_alternative_propellant_cases

      - name: Validate four requested propulsion families
        run: python -m ntr.nerva.validate_propulsion_modes

      - name: Validate generic nuclear-airbreathing demonstrator
        run: python -m ntr.airbreathing.validate_nuclear_ramjet

      - name: Check nuclear-airbreathing CLI
        run: python -m ntr.airbreathing.run_nuclear_ramjet --help

      - name: Validate generic OpenMC air-heater model
        run: python -m ntr.airbreathing.validate_openmc_airheater

      - name: Check OpenMC air-heater build CLI
        run: python -m ntr.airbreathing.build_openmc_airheater --help

      - name: Check OpenMC air-heater postprocessor CLI
        run: python -m ntr.airbreathing.postprocess_openmc_airheater --help

      - name: Validate OpenMC-to-airbreathing coupling
        run: python -m ntr.airbreathing.validate_openmc_coupling

      - name: Check OpenMC-to-airbreathing coupling CLI
        run: python -m ntr.airbreathing.couple_openmc_airheater --help

      - name: Export generic fixed-source OpenMC air heater
        run: |
          python -m ntr.airbreathing.build_openmc_airheater \
            --batches 4 \
            --particles 100 \
            --output build/openmc_airheater_ci
          for f in geometry.xml materials.xml settings.xml tallies.xml plots.xml; do
            test -s "build/openmc_airheater_ci/$f"
          done

      - name: Export four requested propulsion families
        run: python -m ntr.nerva.run_propulsion_modes

      - name: Reconstruct four alternative-propellant NTP cases
        run: python -m ntr.nerva.run_alternative_propellant_cases

      - name: Check physics-based NERVA engine CLI
        run: python -m ntr.nerva.run_nerva_engine --help

      - name: Validate published NERVA historical presets
        run: python -m ntr.nerva.validate_historical_presets

      - name: Validate LANTR and bimodal NTR reference model
        run: python -m ntr.nerva.validate_lantr

      - name: Syntax-check NERVA web dashboard
        run: python -m py_compile streamlit_app.py ntr/nerva/webapp.py

      - name: Run synthetic end-to-end thermal pipeline
        run: |
          python -m ntr.nerva.validate_resolved_transient \
            --write-fixture build/nerva_synthetic/resolved_inputs
          python -m ntr.nerva.run_resolved_transient \
            build/nerva_synthetic/resolved_inputs/mesh_fields.npz \
            build/nerva_synthetic/resolved_inputs/fuel_reconstruction.npz \
            build/nerva_synthetic/resolved_inputs/tie_reconstruction.npz \
            --allow-synthetic --steps 3 --dt-s 0.1 \
            --refine-levels 4 --refine-tolerance-k 0.5 \
            --initial-solid-k 500 --initial-gas-k 300 \
            --inlet-temperature-k 300 \
            --fuel-solid-capacity-j-k 5000 \
            --fuel-gas-capacity-j-k 500 \
            --fuel-ua-w-k 100 \
            --tie-solid-capacity-j-k 3000 \
            --tie-supply-capacity-j-k 600 \
            --tie-return-capacity-j-k 700 \
            --tie-supply-ua-w-k 80 \
            --tie-return-ua-w-k 90 \
            --output build/nerva_synthetic/resolved_transient
          python -m ntr.nerva.make_synthetic_fields \
            --output build/nerva_synthetic/nerva_mesh_fields.npz
          python -m ntr.nerva.run_openmc_transient \
            --fields build/nerva_synthetic/nerva_mesh_fields.npz \
            --allow-synthetic \
            --integrator implicit --gas-enthalpy-model nasa7-h2 \
            --power-mw 1 --steps 5 --dt-s 0.01 \
            --inlet-temperature-k 500 \
            --initial-solid-k 650 --initial-gas-k 500 \
            --fuel-mass-flow-kg-s 2.0 --tie-mass-flow-kg-s 0.4 \
            --fuel-solid-capacity-j-k 1000000 --fuel-gas-capacity-j-k 200000 \
            --tie-solid-capacity-j-k 400000 --tie-gas-capacity-j-k 100000 \
            --fuel-ua-w-k 100000 --tie-ua-w-k 20000 \
            --output build/nerva_synthetic/transient
          python -m ntr.nerva.solve_thermal \
            build/nerva_synthetic/nerva_mesh_fields.npz \
            --rings 5 \
            --fuel-mass-flow-kg-s 2.0 \
            --inlet-temperature-k 500 \
            --inlet-pressure-mpa 8 \
            --hydrogen-model constant \
            --output build/nerva_synthetic/fuel
          python -m ntr.nerva.solve_tie_tube \
            build/nerva_synthetic/nerva_mesh_fields.npz \
            --rings 5 \
            --tie-mass-flow-kg-s 0.40 \
            --inlet-temperature-k 500 \
            --inlet-pressure-mpa 8 \
            --hydrogen-model constant \
            --output build/nerva_synthetic/tie
          python -m ntr.nerva.plot_results \
            --power-fields build/nerva_synthetic/nerva_mesh_fields.npz \
            --fuel-profile build/nerva_synthetic/fuel/fuel_channel_profile.csv \
            --tie-supply-profile build/nerva_synthetic/tie/tie_supply_profile.csv \
            --tie-return-profile build/nerva_synthetic/tie/tie_return_profile.csv \
            --output build/nerva_synthetic/plots

      - name: Export synthetic NERVA VTK fields
        run: |
          python -m ntr.nerva.export_vtk \
            build/nerva_synthetic/nerva_mesh_fields.npz \
            --output build/nerva_synthetic/nerva_fields.vtk
          test -s build/nerva_synthetic/nerva_fields.vtk

      - name: Verify synthetic pipeline products
        run: |
          test -s build/nerva_synthetic/resolved_transient/resolved_transient_summary.json
          test -s build/nerva_synthetic/resolved_transient/temporal_convergence_report.json
          python -c "import json; p=json.load(open('build/nerva_synthetic/resolved_transient/temporal_convergence_report.json')); assert p['status']=='PASS'; assert p['energy_residual_passed']; print('Thermal timestep refinement PASS: ',p['difference_infinity_k'])"
          test -s build/nerva_synthetic/resolved_transient/resolved_transient_final_state.npz
          test -s build/nerva_synthetic/transient/openmc_transient_report.json
          test -s build/nerva_synthetic/transient/openmc_transient_history.csv
          test -s build/nerva_synthetic/fuel/thermal_summary.json
          test -s build/nerva_synthetic/tie/tie_thermal_summary.json
          test -s build/nerva_synthetic/plots/total_power_midplane.png
          test -s build/nerva_synthetic/plots/fuel_temperatures.png
          test -s build/nerva_synthetic/plots/tie_temperatures.png

      - name: Upload synthetic NERVA demo products
        uses: actions/upload-artifact@v4
        with:
          name: nerva-synthetic-demo
          path: build/nerva_synthetic

      - name: Export seven-position cluster
        run: |
          python -m ntr.nerva.build_model \
            --assembly cluster \
            --output build/nerva_cluster

      - name: Export representative mixed fuel-tie core
        run: |
          python -m ntr.nerva.build_model \
            --assembly mixed-core \
            --rings 5 \
            --output build/nerva_mixed_core

      - name: Export full reactor with inward-facing absorbers
        run: |
          python -m ntr.nerva.build_model \
            --assembly reactor \
            --rings 5 \
            --drum-angle 0 \
            --output build/nerva_reactor_in

      - name: Export full reactor with outward-facing absorbers
        run: |
          python -m ntr.nerva.build_model \
            --assembly reactor \
            --rings 5 \
            --drum-angle 180 \
            --output build/nerva_reactor_out

      - name: Export small all-fuel regression core
        run: |
          python -m ntr.nerva.build_model \
            --assembly core \
            --output build/nerva_core

      - name: Verify exported OpenMC inputs
        run: |
          for d in \
            build/nerva_cluster \
            build/nerva_mixed_core \
            build/nerva_reactor_in \
            build/nerva_reactor_out \
            build/nerva_core; do
            for f in geometry.xml materials.xml settings.xml tallies.xml plots.xml; do
              test -s "$d/$f"
              echo "$d/$f"
            done
          done
