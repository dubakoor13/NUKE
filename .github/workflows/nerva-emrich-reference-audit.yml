name: NERVA Emrich 2023 source-PDF physics reference audit

on:
  pull_request:
    paths:
      - 'William J. Emrich Jr. - Principles of Nuclear Rocket Propulsion-Butterworth-Heinemann (2023).pdf'
      - 'ntr/nerva/emrich_reference_audit.py'
      - 'ntr/nerva/validate_emrich_reference_audit.py'
      - 'ntr/nerva/EMRICH_2023_CORE_PHYSICS_CROSSWALK.md'
      - 'ntr/nerva/REFERENCES.md'
      - '.github/workflows/nerva-emrich-reference-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  exact-source-pdf-provenance:
    name: Inspect exact 2023 Emrich PDF, chapter headings and NUKE physics crosswalk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install strictly text-extraction-only PDF dependency
        run: |
          python -m pip install 'pypdf>=5,<7' 'fonttools>=4,<6'

      - name: Validate false table-of-contents hits and chapter order
        run: |
          python -m ntr.nerva.validate_emrich_reference_audit

      - name: Inspect the ACTUAL book PDF already committed in NUKE
        run: |
          mkdir -p build/nerva_reference
          python -m ntr.nerva.emrich_reference_audit \
            --pdf 'William J. Emrich Jr. - Principles of Nuclear Rocket Propulsion-Butterworth-Heinemann (2023).pdf' \
            --repo-root . \
            --output build/nerva_reference/emrich_2023_pdf_chapter_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/nerva_reference/emrich_2023_pdf_chapter_audit.json')
          record=json.loads(p.read_text(encoding='utf-8'))
          assert record['all_referenced_nuke_paths_exist']
          assert record['source_pdf_page_count'] > 320
          assert len(record['source_pdf_sha256']) == 64
          # 2023 book has 14 front-matter pages; verify the offset from
          # multiple independently extracted chapter headings, NOT by
          # assuming printed and PDF page numbers coincide.
          assert set((5,7,8,15)).issubset(record['critical_chapter_headings_found'])
          assert record['observed_verified_printed_to_pdf_page_offset'] == 14
          assert record['number_of_independently_consistent_printed_to_pdf_page_offsets'] >= 5
          located={str(r['chapter']):r for r in record['chapter_location_crosswalk']}
          for number, printed, pdf in [(5,59,73),(7,107,121),(8,115,129),(15,287,301)]:
              assert located[str(number)]['publisher_second_edition_printed_start_page']==printed
              assert located[str(number)]['first_pdf_page_1_based_if_detected']==pdf
          for number, inferred in [(6,111),(9,149)]:
              row=located[str(number)]
              if not row['page_heading_verified_in_actual_pdf']:
                  assert row['pdf_page_inferred_from_consistent_printed_offset']==inferred
                  assert row['requires_visual_heading_check']
          assert record['nasa_nerva_test_data_validated_against_primary_sources'] is False
          assert record['actual_pdf_equations_transcribed_and_independently_checked'] is False
          assert record['nuke_calculations_benchmarked_against_emrich_exercises'] is False
          print('Genuine Emrich 2023 PDF and NUKE core-physics chapter traceability VERIFIED.')
          print('Textbook equation extraction and NASA reactor measurements: NOT YET VALIDATED.')
          PY

      - name: Preserve ONLY source-PDF indexing metadata, not the copyrighted PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-emrich-2023-actual-pdf-chapter-index
          path: build/nerva_reference/emrich_2023_pdf_chapter_audit.json
          if-no-files-found: warn
          retention-days: 21
