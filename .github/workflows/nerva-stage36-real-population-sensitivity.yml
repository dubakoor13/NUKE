name: NUKE Stage36 original coupled OpenMC particle-population sensitivity

on:
  pull_request:
    paths:
      - 'ntr/nerva/real_coupled_population_sensitivity.py'
      - 'ntr/nerva/validate_stage36_population_sensitivity.py'
      - 'ntr/nerva/real_coupled_source_temporal.py'
      - 'ntr/nerva/real_coupled_disjoint_heating.py'
      - '.github/workflows/nerva-stage36-real-population-sensitivity.yml'
  push:
    paths:
      - 'ntr/nerva/real_coupled_population_sensitivity.py'
      - 'ntr/nerva/validate_stage36_population_sensitivity.py'
      - 'ntr/nerva/real_coupled_source_temporal.py'
      - 'ntr/nerva/real_coupled_disjoint_heating.py'
      - '.github/workflows/nerva-stage36-real-population-sensitivity.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  original-openmc-neutron-photon-population-3000-vs-6000:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve EXACT original 3000-particle four-seed coupled HDF5 from Stage33
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/stage36_baseline_3000 build/stage36_candidate_6000 build/stage36_comparison
          gh run download 40741032756 -R "$GITHUB_REPOSITORY" \
            -n nuke-stage33-original-coupled-temporal-fission-source-hdf5 \
            -D build/stage36_baseline_3000
          test -s build/stage36_baseline_3000/actual_four_seed_coupled_heating_covariance.json
          for seed in 13007 23011 33013 43019; do
            test -s "build/stage36_baseline_3000/seed_${seed}/transport_provenance.json"
            for batch in 30 45 65; do
              test -s "build/stage36_baseline_3000/seed_${seed}/statepoint.${batch}.h5"
            done
          done
      - name: Pin genuine evaluated-data OpenMC C++ 0.15.3 transport image
        run: |
          set -euo pipefail
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' > build/stage36_candidate_6000/openmc_image_repo_digest.json
      - name: Execute four NEW original coupled neutron/photon histories at 6000 per generation
        run: |
          docker run --rm --cpus=2 --memory=6g -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert not openmc.__file__.startswith(\"/repo/\")"
              test -s "$OPENMC_CROSS_SECTIONS"
              openmc --version
              python -m unittest ntr.nerva.validate_stage36_population_sensitivity.PopulationSensitivityMathTests -v
              for seed in 13007 23011 33013 43019; do
                echo "ORIGINAL NEUTRON + PHOTON OpenMC 6000/generation SEED $seed"
                python -m ntr.nerva.run_openmc_transport \
                  --cross-sections "$OPENMC_CROSS_SECTIONS" \
                  --assembly core --rings 3 \
                  --particles 6000 --batches 65 --inactive 20 \
                  --statepoint-batches 30 45 65 --seed "$seed" \
                  --hydrogen-temperature-k 293.6059129982851 \
                  --photon-transport \
                  --heating-mesh-dimensions 12 12 10 \
                  --diagnostic-energy-groups 24 --axial-mesh-bins 24 \
                  --output "/repo/build/stage36_candidate_6000/seed_$seed"
                for batch in 30 45 65; do
                  test -s "/repo/build/stage36_candidate_6000/seed_$seed/statepoint.$batch.h5"
                done
              done
              python -m ntr.nerva.real_coupled_photon_heating_ensemble \
                --root /repo/build/stage36_candidate_6000 \
                --output /repo/build/stage36_candidate_6000/actual_four_seed_coupled_heating_covariance.json
              NUKE_STAGE31_REAL_COUPLED_SOURCE_ROOT=/repo/build/stage36_candidate_6000 \
                python -m unittest ntr.nerva.validate_stage31_coupled_heating_ensemble.ActualOriginalCoupledOpenMCFourSeedTests -v
              python -m ntr.nerva.real_coupled_population_sensitivity \
                --baseline-3000 /repo/build/stage36_baseline_3000 \
                --candidate-6000 /repo/build/stage36_candidate_6000 \
                --output /repo/build/stage36_comparison/actual_coupled_population_sensitivity.json
              NUKE_STAGE36_REAL_BASELINE_3000=/repo/build/stage36_baseline_3000 \
              NUKE_STAGE36_REAL_CANDIDATE_6000=/repo/build/stage36_candidate_6000 \
                python -m unittest ntr.nerva.validate_stage36_population_sensitivity.ActualOriginalPopulationOpenMCTests -v
              python -c "import json; r=json.load(open(\"/repo/build/stage36_comparison/actual_coupled_population_sensitivity.json\")); assert r[\"physical_source_HDF5_count\"]==24 and r[\"identical_geometry_material_tally_xml_and_evaluated_data_across_populations\"] and not r[\"reactor_hot_core_criticality_or_watts_qualified\"]; print(\"Four new genuine 6000-particle OpenMC neutron/photon histories checked against 3000; HOT CORE NOT QUALIFIED\")"
            '
      - name: Preserve the original 6000-generation OpenMC native inputs and source/heating archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage36-6000-original-coupled-source-HDF5
          path: |
            build/stage36_candidate_6000/*.json
            build/stage36_candidate_6000/seed_*/*.json
            build/stage36_candidate_6000/seed_*/*.xml
            build/stage36_candidate_6000/seed_*/statepoint.30.h5
            build/stage36_candidate_6000/seed_*/statepoint.45.h5
            build/stage36_candidate_6000/seed_*/statepoint.65.h5
            build/stage36_candidate_6000/seed_*/summary.h5
          retention-days: 21
          if-no-files-found: warn
      - name: Preserve descriptive cross-population physics and full source/heating arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage36-actual-3000-vs-6000-population-physics
          path: build/stage36_comparison/*
          retention-days: 21
          if-no-files-found: warn
