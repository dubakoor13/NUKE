name: FX2-TH StatePoint heating numerical QA

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_openmc_statepoint_heating.py'
      - 'ntr/nerva/validate_fx2th_openmc_statepoint_heating.py'
      - '.github/workflows/fx2th-statepoint-heating.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_openmc_statepoint_heating.py'
      - 'ntr/nerva/validate_fx2th_openmc_statepoint_heating.py'
      - '.github/workflows/fx2th-statepoint-heating.yml'

permissions:
  contents: read

jobs:
  independent-physics-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sparse algebra and array dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11' 'h5py>=3.8'
      - name: Stage 9 source/energy unit regression
        run: python -m ntr.nerva.validate_fx2th_transport_heat_projection
      - name: Stage 10 strict OpenMC object-shape and statistical QA
        run: python -m ntr.nerva.validate_fx2th_openmc_statepoint_heating
