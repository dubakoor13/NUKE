name: NUKE Stage37 original OpenMC initial-fission-source relaxation and heat stability

on:
  pull_request:
    paths:
      - 'ntr/nerva/real_coupled_initial_source_relaxation.py'
      - 'ntr/nerva/validate_stage37_initial_source_relaxation.py'
      - 'ntr/nerva/model.py'
      - 'ntr/nerva/run_openmc_transport.py'
      - '.github/workflows/nerva-stage37-source-initialization-relaxation.yml'
  push:
    paths:
      - 'ntr/nerva/real_coupled_initial_source_relaxation.py'
      - 'ntr/nerva/validate_stage37_initial_source_relaxation.py'
      - 'ntr/nerva/model.py'
      - 'ntr/nerva/run_openmc_transport.py'
      - '.github/workflows/nerva-stage37-source-initialization-relaxation.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eight-real-coupled-openmc-source-initialization-histories:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin evaluated-data neutron photon OpenMC C++ v0.15.3 executable
        run: |
          set -euo pipefail
          mkdir -p build/stage37
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' > build/stage37/openmc_image_repo_digest.json
      - name: Execute eight genuine independent OpenMC neutron and photon histories
        run: |
          docker run --rm --cpus=2 --memory=6g -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert not openmc.__file__.startswith(\"/repo/\")"
              test -s "$OPENMC_CROSS_SECTIONS"
              openmc --version
              python -m unittest ntr.nerva.validate_stage37_initial_source_relaxation.InitialSourceRelaxationMathTests -v
              for mode in legacy-broad central-compact; do
                for seed in 13007 23011 33013 43019; do
                  echo "=== ACTUAL OpenMC source initialization $mode, independent seed $seed ==="
                  python -m ntr.nerva.run_openmc_transport \
                    --cross-sections "$OPENMC_CROSS_SECTIONS" \
                    --assembly core --rings 3 \
                    --particles 3000 --batches 100 --inactive 20 \
                    --statepoint-batches 30 60 100 --seed "$seed" \
                    --initial-fission-source "$mode" \
                    --hydrogen-temperature-k 293.6059129982851 \
                    --photon-transport \
                    --heating-mesh-dimensions 12 12 10 \
                    --diagnostic-energy-groups 24 --axial-mesh-bins 24 \
                    --output "/repo/build/stage37/$mode/seed_$seed"
                  for checkpoint in 30 60 100; do
                    printf -v padded "%03d" "$checkpoint"
                    test -s "/repo/build/stage37/$mode/seed_$seed/statepoint.$padded.h5"
                  done
                done
              done
              python -m ntr.nerva.real_coupled_initial_source_relaxation \
                --root /repo/build/stage37 \
                --output /repo/build/stage37/actual_initial_fission_source_relaxation.json
              NUKE_STAGE37_REAL_EIGHT_OPENMC_ROOT=/repo/build/stage37 \
                python -m unittest ntr.nerva.validate_stage37_initial_source_relaxation.ActualOriginalOpenMCInitialSourceTests -v
              test -s /repo/build/stage37/actual_initial_fission_source_relaxation.npz
              python -c "import json; r=json.load(open(\"/repo/build/stage37/actual_initial_fission_source_relaxation.json\")); assert r[\"genuine_coupled_native_HDF5_count\"]==24 and r[\"physical_reactor_geometry_material_tally_and_evaluated_data_identical\"] and not r[\"statistically_stationary_source_qualified\"]; print(\"REAL source initialization experiment verified; no hot reactor qualification\")"
            '
      - name: Archive all original source-mode OpenMC HDF5, physical XML and data fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage37-original-broad-vs-compact-neutron-photon-hdf5
          path: |
            build/stage37/openmc_image_repo_digest.json
            build/stage37/*/seed_*/*.json
            build/stage37/*/seed_*/*.xml
            build/stage37/*/seed_*/statepoint.030.h5
            build/stage37/*/seed_*/statepoint.060.h5
            build/stage37/*/seed_*/statepoint.100.h5
            build/stage37/*/seed_*/summary.h5
          retention-days: 21
          if-no-files-found: warn
      - name: Archive source/heat time-window distributions as JSON and NPZ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage37-actual-source-initialization-relaxation-physics
          path: |
            build/stage37/actual_initial_fission_source_relaxation.json
            build/stage37/actual_initial_fission_source_relaxation.npz
          retention-days: 21
          if-no-files-found: warn
