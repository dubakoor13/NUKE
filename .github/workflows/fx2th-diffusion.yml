name: FX2-TH spatial diffusion numerics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_diffusion.py'
      - 'ntr/nerva/validate_fx2th_diffusion.py'
      - '.github/workflows/fx2th-diffusion.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_diffusion.py'
      - 'ntr/nerva/validate_fx2th_diffusion.py'
      - '.github/workflows/fx2th-diffusion.yml'

jobs:
  spatial-diffusion-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Run FX2-TH diffusion and adjoint regression tests
        run: python -m ntr.nerva.validate_fx2th_diffusion
