name: NUKE Stage61 OpenMC 3D exact cutcell heat mapping

on:
  push:
    paths:
      - 'ntr/nerva/openmc_native_spatial_fuel_heating.py'
      - 'ntr/nerva/validate_stage61_native_spatial_heating.py'
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - '.github/workflows/nerva-stage61-native-spatial-fuel.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  pull_request:
    paths:
      - 'ntr/nerva/openmc_native_spatial_fuel_heating.py'
      - 'ntr/nerva/validate_stage61_native_spatial_heating.py'
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - '.github/workflows/nerva-stage61-native-spatial-fuel.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  physically-conservative-local-fuel-mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic sparse geometry/HDF5 runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Verify exact geometric 3D heating and Stage52-60 core regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Print nonuniform 3D power mapping and scope demonstration
        run: |
          python - <<'PY'
          import numpy as np
          from ntr.nerva.validate_stage61_native_spatial_heating import local_native
          from ntr.nerva.validate_stage58_fuel_hydrogen_coupling import coupled
          from ntr.nerva.openmc_native_spatial_fuel_heating import project_native_3d_fuel_heating
          m=coupled(film=0.,nz=4,nx=20,ny=24)
          native=local_native(m)
          mapped=project_native_3d_fuel_heating(
              m.config,native,m.solid,
              isolated_element_geometry_confirmed=True)
          print('Stage61 native source dimensions:',native.mesh_dimensions)
          print('Stage61 resolved fuel cells:',m.solid.transverse.n_fuel)
          print('Stage61 total native source score eV/source:',
                native.source_mesh_mean_ev_per_source.sum())
          print('Stage61 full 3D mapped heat W:',
                mapped.resolved.mapped_fuel_power_w)
          print('Stage61 3D energy conservation residual W:',
                mapped.resolved.fuel_power_balance_residual_w)
          print('Stage61 mapped uncertainty conservative bound W:',
                mapped.total_uncertainty_bound_w)
          print('Stage61 single-element scope is caller-asserted, NOT independently verified')
          print('Stage61 native HDF5 source here is SYNTHETIC, no genuine OpenMC transport')
          assert abs(mapped.resolved.fuel_power_balance_residual_w)<1e-10
          PY
