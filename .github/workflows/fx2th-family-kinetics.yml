name: FX2-TH family delayed-neutron contract

on:
  push:
    paths:
      - 'ntr/nerva/delayed_family_contract.py'
      - 'ntr/nerva/validate_delayed_family_contract.py'
      - '.github/workflows/fx2th-family-kinetics.yml'
  pull_request:
    paths:
      - 'ntr/nerva/delayed_family_contract.py'
      - 'ntr/nerva/validate_delayed_family_contract.py'
      - '.github/workflows/fx2th-family-kinetics.yml'

permissions:
  contents: read

jobs:
  family-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26'
      - name: Original delayed importance checks from stage 5
        run: python -m ntr.nerva.validate_delayed_importance_operator
      - name: Verify family neutron production and FX2-TH adapters
        run: python -m ntr.nerva.validate_delayed_family_contract
