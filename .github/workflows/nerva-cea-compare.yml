name: NERVA independent NASA CEA comparison
on:
  pull_request:
    paths:
      - 'ntr/nerva/nasa_hydrogen.py'
      - 'ntr/nerva/compare_nasa_cea.py'
      - 'ntr/nerva/nasa_cea_rocket.py'
      - 'ntr/nerva/validate_nasa_cea_rocket.py'
      - 'ntr/nerva/engine_stream_balance.py'
      - 'ntr/nerva/nerva_xe_stream_report.py'
      - '.github/workflows/nerva-cea-compare.yml'
  push:
    branches: [main]
    paths:
      - 'ntr/nerva/nasa_hydrogen.py'
      - 'ntr/nerva/compare_nasa_cea.py'
      - '.github/workflows/nerva-cea-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-thermodynamics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official NASA CEA Python package
        run: python -m pip install numpy cea==3.3.4
      - name: Compare hydrogen thermodynamic properties to NASA CEA
        run: |
          python -m ntr.nerva.compare_nasa_cea \
            --pc-mpa 3.10264 \
            --temperatures-k 2350 2500 2700 2900 \
            --output build/nerva_nasa_cea_comparison.json
      - name: Validate NASA CEA IAC rocket nozzle and custom NASA-7 cross-check
        run: python -m ntr.nerva.validate_nasa_cea_rocket
      - name: Reconstruct XE-Prime mass/thrust closure with explicit bleed assumptions
        run: python -m ntr.nerva.nerva_xe_stream_report
      - uses: actions/upload-artifact@v4
        with:
          name: nerva-nasa-cea-comparison
          path: |
            build/nerva_nasa_cea_comparison.json
            build/nerva/cea_rocket_reference_comparison.json
            build/nerva/xe_prime_stream_balance.json
