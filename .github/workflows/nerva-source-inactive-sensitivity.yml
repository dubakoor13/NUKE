name: NERVA actual OpenMC fission-source inactive-batch sensitivity

on:
  pull_request:
    paths:
      - '.github/workflows/nerva-source-inactive-sensitivity.yml'
      - 'ntr/nerva/inactive_source_sensitivity.py'
      - 'ntr/nerva/validate_inactive_source_sensitivity.py'
      - 'ntr/nerva/run_real_core_replicas.py'
      - 'ntr/nerva/source_resolution_audit.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  real-inactive-batch-transport:
    name: Genuine 30 vs 110 inactive-source generations, 90 active each
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Pull genuine OpenMC 0.15.3 C++ and evaluated NNDC neutron data
        run: |
          set -euo pipefail
          mkdir -p build/nerva_source_inactive
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 --format '{{json .RepoDigests}}' \
            | tee build/nerva_source_inactive/docker_repo_digest.json
          docker image inspect openmc/openmc:v0.15.3 --format '{{.Id}}' \
            | tee build/nerva_source_inactive/docker_image_id.txt

      - name: Execute real neutron C++ eigenvalue source relaxation at unchanged core physics
        run: |
          set -euo pipefail
          docker run --rm --cpus=2 --memory=6g \
            -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              cd /tmp
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; print(openmc.__version__,openmc.__file__); assert not openmc.__file__.startswith(\"/repo/\")"
              openmc --version
              test -f "$OPENMC_CROSS_SECTIONS"
              python -m ntr.nerva.validate_inactive_source_sensitivity

              echo "ACTUAL OpenMC short source burn-in: 30 inactive + 90 active"
              python -m ntr.nerva.run_real_core_replicas \
                --rings 3 --particles 3000 --batches 120 --inactive 30 \
                --source-bank-batches 40 60 80 100 120 \
                --hydrogen-temperature-k 293.6059129982851 \
                --seeds 13007 23011 33013 43019 \
                --output /repo/build/nerva_source_inactive/short

              echo "ACTUAL OpenMC extended source burn-in: 110 inactive + 90 active"
              python -m ntr.nerva.run_real_core_replicas \
                --rings 3 --particles 3000 --batches 200 --inactive 110 \
                --source-bank-batches 120 140 160 180 200 \
                --hydrogen-temperature-k 293.6059129982851 \
                --seeds 53003 63007 73009 83003 \
                --output /repo/build/nerva_source_inactive/extended

              python -m ntr.nerva.inactive_source_sensitivity \
                --short /repo/build/nerva_source_inactive/short \
                --extended /repo/build/nerva_source_inactive/extended \
                --output /repo/build/nerva_source_inactive/actual_burnin_comparison.json
              python -c "import json; r=json.load(open(\"/repo/build/nerva_source_inactive/actual_burnin_comparison.json\")); assert r[\"physical_reactor_core_unchanged\"]; assert r[\"same_number_of_active_tally_generations\"]; assert r[\"both_source_arms_passed_information_inequalities\"]; assert all(r[k][\"nested_JSD_TV_information_bounds_verified\"] for k in (\"source_a\",\"source_b\")); assert not r[\"source_information_divergence_is_a_convergence_probability\"]; assert not r[\"fission_source_stationarity_independently_proven\"]; print(\"PASS: ACTUAL evaluated-data fission-source burn-in sensitivity recorded without convergence claim\")"
            '

      - name: Save actual OpenMC source-bank and evaluated data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-real-source-inactive-30-vs-110
          path: build/nerva_source_inactive/
          if-no-files-found: warn
          retention-days: 21
