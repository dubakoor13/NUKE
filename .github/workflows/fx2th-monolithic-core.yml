name: FX2-TH nonlinear spatial core neutron-thermal equations

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_monolithic_rz_core.py'
      - 'ntr/nerva/validate_fx2th_monolithic_rz_core.py'
      - '.github/workflows/fx2th-monolithic-core.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_monolithic_rz_core.py'
      - 'ntr/nerva/validate_fx2th_monolithic_rz_core.py'
      - '.github/workflows/fx2th-monolithic-core.yml'

permissions:
  contents: read

jobs:
  nonlinear-core-conservation-and-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial/sparse numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Verify temperature-dependent multigroup table operator
        run: python -m ntr.nerva.validate_fx2th_rz_temperature_tables
      - name: Verify nonlinear spatial reactor-core and thermal conservation
        run: python -m ntr.nerva.validate_fx2th_monolithic_rz_core
