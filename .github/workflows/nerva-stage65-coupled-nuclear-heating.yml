name: NUKE Stage65 neutron photon deposited-energy transport numerics

on:
  push:
    paths:
      - 'ntr/nerva/tallies.py'
      - 'ntr/nerva/openmc_native_coupled_fuel_heating.py'
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - 'ntr/nerva/openmc_native_spatial_fuel_heating.py'
      - 'ntr/nerva/validate_stage65_coupled_nuclear_heating.py'
      - '.github/workflows/nerva-stage65-coupled-nuclear-heating.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  pull_request:
    paths:
      - 'ntr/nerva/tallies.py'
      - 'ntr/nerva/openmc_native_coupled_fuel_heating.py'
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - 'ntr/nerva/openmc_native_spatial_fuel_heating.py'
      - 'ntr/nerva/validate_stage65_coupled_nuclear_heating.py'
      - '.github/workflows/nerva-stage65-coupled-nuclear-heating.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  neutron-photon-energy-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse thermal and HDF5 runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Verify coupled neutron photon tally physics and all prior Stage52-64 numerical tests
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage65_coupled_nuclear_heating -v
          python -m unittest ntr.nerva.validate_stage64_native_mesh_order -v
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Report synthetic coupled neutron photon heat and energy closure
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from ntr.nerva.validate_stage65_coupled_nuclear_heating import coupled_native_fixture,load
          from ntr.nerva.validate_stage58_fuel_hydrogen_coupling import coupled
          from ntr.nerva.openmc_native_spatial_fuel_heating import project_native_3d_fuel_heating
          m=coupled(film=0.,nz=4,nx=20,ny=24)
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'synthetic.statepoint.h5'
              coupled_native_fixture(p,model=m)
              source=load(p)
              q=project_native_3d_fuel_heating(
                  m.config,source,m.solid,
                  isolated_element_geometry_confirmed=True)
              print('Stage65 synthetic neutron fuel heating [W]:',q.resolved.fuel_neutron_power_w)
              print('Stage65 synthetic photon fuel heating [W]:',q.resolved.fuel_photon_power_w)
              print('Stage65 combined fuel heating [W]:',q.resolved.mapped_fuel_power_w)
              print('Stage65 heat mapping residual [W]:',q.resolved.fuel_power_balance_residual_w)
              print('Stage65 heat uncertainty conservative bound [W]:',q.total_uncertainty_bound_w)
              print('Stage65 NO GENUINE OPENMC TRANSPORT OR REACTOR POWER VALIDATED')
              assert q.resolved.fuel_neutron_power_w>0
              assert q.resolved.fuel_photon_power_w>0
              assert abs(q.resolved.fuel_power_balance_residual_w)<1e-11
          PY
