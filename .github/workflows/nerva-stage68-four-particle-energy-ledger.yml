name: NUKE Stage68 four-particle full-core deposited energy closure

on:
  push:
    paths:
      - 'ntr/nerva/openmc_full_core_energy_ledger.py'
      - 'ntr/nerva/validate_stage68_full_core_energy_ledger.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage68-four-particle-energy-ledger.yml'
  pull_request:
    paths:
      - 'ntr/nerva/openmc_full_core_energy_ledger.py'
      - 'ntr/nerva/validate_stage68_full_core_energy_ledger.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage68-four-particle-energy-ledger.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-core-independent-energy-conservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HDF5 and thermal numerics
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Verify Stage68 independent material-vs-particle core energy and Stage52-67 regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage68_full_core_energy_ledger -v
          python -m unittest ntr.nerva.validate_stage67_hydrogen_channel_heating -v
          python -m unittest ntr.nerva.validate_stage66_direct_hydrogen_deposition -v
          python -m unittest ntr.nerva.validate_stage65_coupled_nuclear_heating -v
          python -m unittest ntr.nerva.validate_stage64_native_mesh_order -v
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Show synthetic full-core independent HEATING ledger
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from ntr.nerva.validate_stage68_full_core_energy_ledger import fixture,IDS,RATE,SHA
          from ntr.nerva.openmc_full_core_energy_ledger import read_openmc_full_core_energy_ledger
          with tempfile.TemporaryDirectory() as root:
              file=Path(root)/'synthetic.statepoint.10.h5'
              fixture(file)
              r=read_openmc_full_core_energy_ledger(
                  file,expected_material_ids=IDS,
                  source_rate_particles_per_s=RATE,
                  source_rate_basis='SYNTHETIC NOT physical reactor power',
                  nuclear_data_sha256=SHA)
              print('Stage68 independent material HEATING [W]:',r.material_total_w)
              print('Stage68 independent four-particle HEATING [W]:',r.particle_total_w)
              print('Stage68 material minus particle HEATING [W]:',r.material_minus_particle_w)
              print('Stage68 charged secondary HEATING [W]:',r.charged_secondary_power_w)
              print('Stage68 separate fuel HEATING [W]:',r.fuel_power_w)
              print('Stage68 separate hydrogen HEATING [W]:',r.hydrogen_power_w)
              print('Stage68 unresolved nonfuel/H2 material HEATING [W]:',r.nonthermal_material_power_w)
              print('Stage68 covariance-safe stderr upper bound [W]:',
                    r.conservative_difference_stderr_upper_bound_w)
              print('Stage68 HDF5 synthetic: NOT a genuine hot NERVA transport result')
              assert abs(r.material_minus_particle_w)<1e-10
              assert r.charged_secondary_power_w>0
              assert r.nonthermal_material_power_w>0
          PY
