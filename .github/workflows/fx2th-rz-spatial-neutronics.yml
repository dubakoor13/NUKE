name: FX2-TH conservative axisymmetric r-z spatial kinetics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_rz_family_diffusion.py'
      - 'ntr/nerva/validate_fx2th_rz_family_diffusion.py'
      - '.github/workflows/fx2th-rz-spatial-neutronics.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_rz_family_diffusion.py'
      - 'ntr/nerva/validate_fx2th_rz_family_diffusion.py'
      - '.github/workflows/fx2th-rz-spatial-neutronics.yml'

permissions:
  contents: read

jobs:
  rz-multigroup-family-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Run established spatial delayed-neutron tests
        run: python -m ntr.nerva.validate_fx2th_family_spacetime
      - name: Run cylindrical finite-volume and Bessel benchmark
        run: python -m ntr.nerva.validate_fx2th_rz_family_diffusion
