name: NUKE Stage76 quantified coupled reactor-thermal mesh convergence

on:
  push:
    paths:
      - 'ntr/nerva/coating_radial_fvm.py'
      - 'ntr/nerva/coating_mesh_convergence.py'
      - 'ntr/nerva/coating_radial_interfaces.py'
      - 'ntr/nerva/fuel_hydrogen_coupled_transient.py'
      - 'ntr/nerva/validate_stage74_coating_radial.py'
      - 'ntr/nerva/validate_stage75_coupled_radial_coating.py'
      - 'ntr/nerva/validate_stage76_coupled_mesh_convergence.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage76-coupled-mesh-convergence.yml'
  pull_request:
    paths:
      - 'ntr/nerva/coating_radial_fvm.py'
      - 'ntr/nerva/coating_mesh_convergence.py'
      - 'ntr/nerva/coating_radial_interfaces.py'
      - 'ntr/nerva/fuel_hydrogen_coupled_transient.py'
      - 'ntr/nerva/validate_stage74_coating_radial.py'
      - 'ntr/nerva/validate_stage75_coupled_radial_coating.py'
      - 'ntr/nerva/validate_stage76_coupled_mesh_convergence.py'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
      - '.github/workflows/nerva-stage76-coupled-mesh-convergence.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  physically-normalized-radial-azimuthal-axial-grid-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse and HDF5 runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Test Stage76 real 3-axis mesh comparisons and Stage52–75 regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage76_coupled_mesh_convergence -v
          python -m unittest ntr.nerva.validate_stage75_coupled_radial_coating -v
          python -m unittest ntr.nerva.validate_stage74_coating_radial -v
          python -m unittest ntr.nerva.validate_stage73_angular_interfaces -v
          python -m unittest ntr.nerva.validate_stage72_coating_angular -v
          python -m unittest ntr.nerva.validate_stage71_axial_coating -v
          python -m unittest ntr.nerva.validate_stage70_resolved_coating -v
          python -m unittest ntr.nerva.validate_stage69_structural_enthalpy -v
          python -m unittest ntr.nerva.validate_stage68_full_core_energy_ledger -v
          python -m unittest ntr.nerva.validate_stage67_hydrogen_channel_heating -v
          python -m unittest ntr.nerva.validate_stage66_direct_hydrogen_deposition -v
          python -m unittest ntr.nerva.validate_stage65_coupled_nuclear_heating -v
          python -m unittest ntr.nerva.validate_stage64_native_mesh_order -v
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Print measured grid differences without claiming asymptotic convergence
        run: |
          python - <<'PY'
          from ntr.nerva.coating_mesh_convergence import (
              run_coupled_mesh_convergence, METRICS,
          )
          from ntr.nerva.validate_stage76_coupled_mesh_convergence import (
              physical_fixture,BASE,HEAT,
          )
          study=run_coupled_mesh_convergence(
              physical_fixture,base_mesh=BASE,heating=HEAT,
              radial_counts=(2,3,4),angular_counts=(8,12,16),
              axial_counts=(2,3,4))
          print('Stage76 physical grid cases, unique:',study.unique_cases_run)
          print('Stage76 max relative first-law residual:',
                study.max_relative_first_law_residual)
          print('Stage76 max nuclear-source rebin difference [J]:',
                study.maximum_nuclear_source_imbalance_j)
          for key,axis in study.axes.items():
              print('Stage76 refinement axis:',key,'grids:',axis.counts)
              for metric in ('fuel_peak_k','coating_peak_k',
                             'fuel_outer_wall_peak_abs_w_m2',
                             'hydrogen_inner_wall_peak_abs_w_m2',
                             'coating_to_hydrogen_energy_j'):
                  delta=axis.differences[metric]
                  values=[obs.measurements[metric] for obs in axis.observations]
                  print('  ',metric,':',values,'mid-vs-fine:',
                        delta.mid_to_fine_abs,
                        'adjacent difference ratio:',
                        delta.adjacent_difference_ratio,
                        'monotone:',delta.decreasing_successive_differences)
          print('Stage76 SYNTHETIC nuclear densities and material properties;')
          print('no grid-independent NERVA reactor solution claimed')
          assert study.unique_cases_run==7
          assert study.max_relative_first_law_residual<5e-8
          PY
