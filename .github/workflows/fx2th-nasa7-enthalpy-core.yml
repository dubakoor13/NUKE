name: FX2-TH NASA7 H2 enthalpy conjugate core energy

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_enthalpy_conjugate_core.py'
      - 'ntr/nerva/validate_fx2th_enthalpy_conjugate_core.py'
      - 'ntr/nerva/fx2th_enthalpy_rz_feedback.py'
      - 'ntr/nerva/validate_fx2th_enthalpy_rz_feedback.py'
      - 'ntr/nerva/fx2th_resolved_rz_feedback.py'
      - '.github/workflows/fx2th-nasa7-enthalpy-core.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_enthalpy_conjugate_core.py'
      - 'ntr/nerva/validate_fx2th_enthalpy_conjugate_core.py'
      - 'ntr/nerva/fx2th_enthalpy_rz_feedback.py'
      - 'ntr/nerva/validate_fx2th_enthalpy_rz_feedback.py'
      - 'ntr/nerva/fx2th_resolved_rz_feedback.py'
      - '.github/workflows/fx2th-nasa7-enthalpy-core.yml'

permissions:
  contents: read

jobs:
  molecular-h2-enthalpy-and-fuel-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Stage 19 resolved fuel conduction and hydrogen flow conservation
        run: python -m ntr.nerva.validate_fx2th_conjugate_fuel_transport
      - name: Stage 20 nonlinear NASA7 hydrogen enthalpy and conjugate fuel energy
        run: python -m ntr.nerva.validate_fx2th_enthalpy_conjugate_core
      - name: Previous Stage 19 spatial neutron feedback regression
        run: python -m ntr.nerva.validate_fx2th_resolved_rz_feedback
      - name: Stage 20 NASA7 enthalpy-coupled spatial neutron and precursor feedback
        run: python -m ntr.nerva.validate_fx2th_enthalpy_rz_feedback
