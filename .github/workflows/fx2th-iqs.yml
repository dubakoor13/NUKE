name: FX2-TH two-rate IQS spatial shape tests

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_iqs.py'
      - 'ntr/nerva/validate_fx2th_iqs.py'
      - '.github/workflows/fx2th-iqs.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_iqs.py'
      - 'ntr/nerva/validate_fx2th_iqs.py'
      - '.github/workflows/fx2th-iqs.yml'

jobs:
  iqs-shape-numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Run 13 space-time numerical checks
        run: python -m ntr.nerva.validate_fx2th_iqs
