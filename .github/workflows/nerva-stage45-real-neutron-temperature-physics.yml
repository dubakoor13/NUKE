name: NUKE Stage45 original evaluated neutron temperature transport physics

on:
  push:
    paths:
      - 'ntr/nerva/config.py'
      - 'ntr/nerva/model.py'
      - 'ntr/nerva/run_openmc_transport.py'
      - 'ntr/nerva/audit_nuclear_data_temperatures.py'
      - 'ntr/nerva/real_evaluated_neutron_temperature_selector.py'
      - 'ntr/nerva/validate_stage45_evaluated_temperature_selector.py'
      - '.github/workflows/nerva-stage45-real-neutron-temperature-physics.yml'
  pull_request:
    paths:
      - 'ntr/nerva/config.py'
      - 'ntr/nerva/model.py'
      - 'ntr/nerva/run_openmc_transport.py'
      - 'ntr/nerva/audit_nuclear_data_temperatures.py'
      - 'ntr/nerva/real_evaluated_neutron_temperature_selector.py'
      - 'ntr/nerva/validate_stage45_evaluated_temperature_selector.py'
      - '.github/workflows/nerva-stage45-real-neutron-temperature-physics.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actual-evaluated-neutron-temperature-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin official OpenMC neutron data and original C++ transport
        run: |
          set -euo pipefail
          mkdir -p build/stage45_cold build/stage45_results
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' > build/stage45_cold/openmc_image_repo_digest.json
      - name: Run physical evaluated-neutron-temperature math and model XML tests
        run: |
          docker run --rm --cpus=2 --memory=6g -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert not openmc.__file__.startswith(\"/repo/\")"
              test -s "$OPENMC_CROSS_SECTIONS"
              python -m unittest ntr.nerva.validate_stage45_evaluated_temperature_selector.EvaluatedTemperatureSelectionMathTests -v
              NUKE_STAGE45_REAL_EVALUATED_XS="$OPENMC_CROSS_SECTIONS" \
                python -m unittest ntr.nerva.validate_stage45_evaluated_temperature_selector.ActualEvaluatedNeutronTemperatureTests -v
              python -m ntr.nerva.validate_nuclear_data
            '
      - name: Execute two ACTUAL OpenMC C++ evaluated-neutron temperature selectors
        run: |
          docker run --rm --cpus=2 --memory=6g -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              test -s "$OPENMC_CROSS_SECTIONS"
              for method in nearest interpolation; do
                echo "ORIGINAL evaluated-data neutron eigenvalue C++ run: $method"
                python -m ntr.nerva.run_openmc_transport \
                  --cross-sections "$OPENMC_CROSS_SECTIONS" \
                  --assembly core --rings 3 --particles 3000 \
                  --batches 24 --inactive 8 --seed 13007 \
                  --neutron-temperature-method "$method" \
                  --fuel-temperature-k 293.6059129982851 \
                  --hydrogen-temperature-k 293.6059129982851 \
                  --heating-mesh-dimensions 12 12 10 \
                  --diagnostic-energy-groups 24 --axial-mesh-bins 24 \
                  --output "/repo/build/stage45_cold/$method"
                test -s "/repo/build/stage45_cold/$method/statepoint.24.h5"
                test -s "/repo/build/stage45_cold/$method/nuclear_data_temperature_audit.json"
                test -s "/repo/build/stage45_cold/$method/settings.xml"
              done
              python -m ntr.nerva.real_evaluated_neutron_temperature_selector \
                --root /repo/build/stage45_cold \
                --cross-sections "$OPENMC_CROSS_SECTIONS" \
                --output /repo/build/stage45_results/actual_evaluated_neutron_selector.json
              python -c "import json; r=json.load(open(\"/repo/build/stage45_results/actual_evaluated_neutron_selector.json\")); assert r[\"original_openmc_CPP_neutron_transport_runs\"]==2 and r[\"geometry_and_material_xml_identical\"] and not r[\"hot_temperature_scattering_interpolation_verified\"]; print(\"Actual C++ evaluated-neutron XS selection physics ACCEPTED; hot core unqualified\")"
            '
      - name: Archive original evaluated-data neutron transport statepoints and XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage45-two-original-openmc-neutron-temperature-hdf5
          path: |
            build/stage45_cold/openmc_image_repo_digest.json
            build/stage45_cold/*/*.xml
            build/stage45_cold/*/*.json
            build/stage45_cold/*/statepoint.24.h5
            build/stage45_cold/*/summary.h5
          retention-days: 21
          if-no-files-found: warn
      - name: Archive actual neutron transport selector physics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage45-original-temperature-selector-physics-json
          path: build/stage45_results/*.json
          retention-days: 21
          if-no-files-found: warn
