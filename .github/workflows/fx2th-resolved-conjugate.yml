name: FX2-TH resolved fuel conduction and H2 axial energy

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_conjugate_fuel_transport.py'
      - 'ntr/nerva/validate_fx2th_conjugate_fuel_transport.py'
      - 'ntr/nerva/fx2th_resolved_rz_feedback.py'
      - 'ntr/nerva/validate_fx2th_resolved_rz_feedback.py'
      - '.github/workflows/fx2th-resolved-conjugate.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_conjugate_fuel_transport.py'
      - 'ntr/nerva/validate_fx2th_conjugate_fuel_transport.py'
      - 'ntr/nerva/fx2th_resolved_rz_feedback.py'
      - 'ntr/nerva/validate_fx2th_resolved_rz_feedback.py'
      - '.github/workflows/fx2th-resolved-conjugate.yml'

permissions:
  contents: read

jobs:
  resolved-neutron-thermal-conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent array/sparse numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Stage 18 monolithic coupled baseline
        run: python -m ntr.nerva.validate_fx2th_monolithic_rz_core
      - name: Annular conduction and axial hydrogen conservation
        run: python -m ntr.nerva.validate_fx2th_conjugate_fuel_transport
      - name: Resolved spatial neutronic and thermal feedback
        run: python -m ntr.nerva.validate_fx2th_resolved_rz_feedback
