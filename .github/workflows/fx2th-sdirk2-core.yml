name: FX2-TH second-order stiff core neutron kinetics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_sdirk2_neutron_kinetics.py'
      - 'ntr/nerva/validate_fx2th_sdirk2_neutron_kinetics.py'
      - '.github/workflows/fx2th-sdirk2-core.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_sdirk2_neutron_kinetics.py'
      - 'ntr/nerva/validate_fx2th_sdirk2_neutron_kinetics.py'
      - '.github/workflows/fx2th-sdirk2-core.yml'

permissions:
  contents: read

jobs:
  independent-multigroup-kinetics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical packages
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Regression of verified axisymmetric finite-volume physics
        run: python -m ntr.nerva.validate_fx2th_rz_family_diffusion
      - name: Second order L-stable implicit and adaptive kinetic validation
        run: python -m ntr.nerva.validate_fx2th_sdirk2_neutron_kinetics
