name: FX2-TH adaptive r-z core neutron kinetics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_adaptive_core_kinetics.py'
      - 'ntr/nerva/validate_fx2th_adaptive_core_kinetics.py'
      - '.github/workflows/fx2th-adaptive-core-kinetics.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_adaptive_core_kinetics.py'
      - 'ntr/nerva/validate_fx2th_adaptive_core_kinetics.py'
      - '.github/workflows/fx2th-adaptive-core-kinetics.yml'

permissions:
  contents: read

jobs:
  adaptive-space-time-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Stage 12 exact cylindrical spatial-kinetics regression
        run: python -m ntr.nerva.validate_fx2th_rz_family_diffusion
      - name: Stage 13 adaptive neutron and precursor timestep tests
        run: python -m ntr.nerva.validate_fx2th_adaptive_core_kinetics
