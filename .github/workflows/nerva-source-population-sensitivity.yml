name: NERVA real OpenMC source-population sensitivity (core only)

on:
  pull_request:
    paths:
      - '.github/workflows/nerva-source-population-sensitivity.yml'
      - 'ntr/nerva/source_population_sensitivity.py'
      - 'ntr/nerva/validate_source_population_sensitivity.py'
      - 'ntr/nerva/population_source_physics.py'
      - 'ntr/nerva/validate_population_source_physics.py'
      - 'ntr/nerva/core_reaction_ensemble.py'
      - 'ntr/nerva/source_resolution_audit.py'
      - 'ntr/nerva/source_energy_audit.py'
      - 'ntr/nerva/run_real_core_replicas.py'
      - 'ntr/nerva/source_bank_trajectory.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  genuine-source-population-sweep:
    name: Actual OpenMC 3000 vs 6000 neutron source histories (4 seeds each)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Pull actual OpenMC C++ binary and evaluated NNDC neutron HDF5
        run: |
          set -euo pipefail
          mkdir -p build/nerva_source_population
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' \
            | tee build/nerva_source_population/docker_image_repo_digest.json
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{.Id}}' \
            | tee build/nerva_source_population/docker_image_id.txt

      - name: Execute unchanged physical core at two neutron populations
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=2 --memory=6g \
            -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              cd /tmp
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert not openmc.__file__.startswith(\"/repo/\")"
              openmc --version
              test -f "$OPENMC_CROSS_SECTIONS"
              python -m ntr.nerva.validate_source_population_sensitivity
              python -m ntr.nerva.validate_population_source_physics

              echo "REAL neutron source population sensitivity: 3000"
              python -m ntr.nerva.run_real_core_replicas \
                --rings 3 --particles 3000 --batches 120 --inactive 30 \
                --source-bank-batches 40 60 80 100 120 \
                --hydrogen-temperature-k 293.6059129982851 \
                --seeds 13007 23011 33013 43019 \
                --output /repo/build/nerva_source_population/3000

              echo "REAL neutron source population sensitivity: 6000"
              python -m ntr.nerva.run_real_core_replicas \
                --rings 3 --particles 6000 --batches 120 --inactive 30 \
                --source-bank-batches 40 60 80 100 120 \
                --hydrogen-temperature-k 293.6059129982851 \
                --seeds 53003 63007 73009 83003 \
                --output /repo/build/nerva_source_population/6000

              python -m ntr.nerva.source_population_sensitivity \
                --low /repo/build/nerva_source_population/3000 \
                --high /repo/build/nerva_source_population/6000 \
                --output /repo/build/nerva_source_population/comparison.json
              python -m ntr.nerva.population_source_physics \
                --low /repo/build/nerva_source_population/3000 \
                --high /repo/build/nerva_source_population/6000 \
                --output /repo/build/nerva_source_population/verified_multiresolution_neutron_physics.json
              python -c "import json; r=json.load(open('/repo/build/nerva_source_population/verified_multiresolution_neutron_physics.json')); assert r['model_unchanged'] and r['neutron_tally_and_source_histogram_identity_passed']; assert r['source_stationarity_demonstrated'] is False and len(r['population_levels'])==2; print('PASS: real HDF5 independent source and reaction physics identity')"

            '

      - name: Preserve actual evaluated-data and OpenMC statepoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-real-source-population-3000-vs-6000
          path: build/nerva_source_population/
          if-no-files-found: warn
          retention-days: 21
