name: FX2-TH OpenMC thermal heating projection numerics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_transport_heat_projection.py'
      - 'ntr/nerva/validate_fx2th_transport_heat_projection.py'
      - '.github/workflows/fx2th-transport-heat-projection.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_transport_heat_projection.py'
      - 'ntr/nerva/validate_fx2th_transport_heat_projection.py'
      - '.github/workflows/fx2th-transport-heat-projection.yml'

permissions:
  contents: read

jobs:
  physical-unit-and-energy-conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sparse numerical requirements
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Regress Stage 8 thermal-conservation coupling
        run: python -m ntr.nerva.validate_fx2th_thermal_feedback
      - name: Verify mesh heating units and conservative transport projection
        run: python -m ntr.nerva.validate_fx2th_transport_heat_projection
