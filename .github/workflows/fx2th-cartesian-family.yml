name: FX2-TH Cartesian multigroup diffusion-to-kinetics equations

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_diffusion.py'
      - 'ntr/nerva/validate_fx2th_diffusion.py'
      - 'ntr/nerva/fx2th_cartesian_family_bridge.py'
      - 'ntr/nerva/validate_fx2th_cartesian_family_bridge.py'
      - '.github/workflows/fx2th-cartesian-family.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_diffusion.py'
      - 'ntr/nerva/validate_fx2th_diffusion.py'
      - 'ntr/nerva/fx2th_cartesian_family_bridge.py'
      - 'ntr/nerva/validate_fx2th_cartesian_family_bridge.py'
      - '.github/workflows/fx2th-cartesian-family.yml'

permissions:
  contents: read

jobs:
  independent-physical-equations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Stage 2 FV diffusion forward-adjoint eigen regression
        run: python -m ntr.nerva.validate_fx2th_diffusion
      - name: Stage 7 family precursor regression
        run: python -m ntr.nerva.validate_fx2th_family_spacetime
      - name: Stage 11 actual 2D diffusion family-kinectics consistency
        run: python -m ntr.nerva.validate_fx2th_cartesian_family_bridge
