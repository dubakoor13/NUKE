name: NUKE executed OpenMC native material and evaluated XS coverage

on:
  push:
    paths:
      - 'ntr/nerva/real_native_material_xs_audit.py'
      - 'ntr/nerva/validate_real_native_material_xs_audit.py'
      - '.github/workflows/nerva-native-material-xs.yml'
  pull_request:
    paths:
      - 'ntr/nerva/real_native_material_xs_audit.py'
      - 'ntr/nerva/validate_real_native_material_xs_audit.py'
      - '.github/workflows/nerva-native-material-xs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-openmc-material-temperature-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native HDF5/array dependencies
        run: python -m pip install 'numpy>=1.26' 'h5py>=3.10'
      - name: Retrieve only ORIGINAL four-seed executed OpenMC artifact
        uses: actions/download-artifact@v4
        with:
          repository: dubakoor13/NUKE
          run-id: 39933618638
          name: nerva-real-openmc-four-seed-core-evidence
          github-token: ${{ github.token }}
          path: build/original
      - name: Require genuine native material summaries, XML and XS manifests
        run: |
          for seed in 13007 23011 33013 43019; do
            test -s "build/original/seed_$seed/summary.h5"
            test -s "build/original/seed_$seed/statepoint.120.h5"
            test -s "build/original/seed_$seed/materials.xml"
          done
          test -s build/original/verified_xs_files.json
      - name: Audit executed materials, native geometry cells and nuclear data coverage
        run: |
          python -m ntr.nerva.real_native_material_xs_audit build/original \
            --output build/real_native_material_xs_gate.json
      - name: Repackage exact downloaded files for destructive provenance tests only
        run: (cd build/original && zip -qr ../regression-original-data.zip .)
      - name: Ten original material/native isotope and tampering numerical tests
        env:
          NUKE_REAL_CORE_EVIDENCE_PATH: build/regression-original-data.zip
        run: python -m ntr.nerva.validate_real_native_material_xs_audit
      - name: Upload small observed material coverage JSON, not unverified isotope binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage25-original-nuclear-data-coverage-observations
          path: build/real_native_material_xs_gate.json
          if-no-files-found: warn
