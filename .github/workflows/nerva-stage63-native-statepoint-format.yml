name: NUKE Stage63 native OpenMC HDF5 source format compatibility

on:
  push:
    paths:
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - 'ntr/nerva/validate_stage60_native_hdf5_heating.py'
      - 'ntr/nerva/validate_stage63_native_statepoint_format.py'
      - '.github/workflows/nerva-stage63-native-statepoint-format.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  pull_request:
    paths:
      - 'ntr/nerva/openmc_native_fuel_statepoint.py'
      - 'ntr/nerva/validate_stage60_native_hdf5_heating.py'
      - 'ntr/nerva/validate_stage63_native_statepoint_format.py'
      - '.github/workflows/nerva-stage63-native-statepoint-format.yml'
      - 'ntr/nerva/CORE_PHYSICS_NUMERICS_TODO.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  true-statepoint-format-numerical-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and HDF5 runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'h5py>=3.10,<4'
      - name: Verify native version/current-batch and Stage52-62 regressions
        run: |
          set -euo pipefail
          python -m unittest ntr.nerva.validate_stage63_native_statepoint_format -v
          python -m unittest ntr.nerva.validate_stage62_native_statepoint_evidence -v
          python -m unittest ntr.nerva.validate_stage61_native_spatial_heating -v
          python -m unittest ntr.nerva.validate_stage60_native_hdf5_heating -v
          python -m unittest ntr.nerva.validate_stage59_core_refinement_heating -v
          python -m unittest ntr.nerva.validate_stage58_fuel_hydrogen_coupling -v
          python -m unittest ntr.nerva.validate_stage57_hydrogen_transient -v
          python -m unittest ntr.nerva.validate_stage56_hydrogen_hydraulics -v
          python -m unittest ntr.nerva.validate_stage55_nonlinear_enthalpy -v
          python -m unittest ntr.nerva.validate_stage54_fuel_cutcell_axial_transport -v
          python -m unittest ntr.nerva.validate_stage53_fuel_cutcell_conduction_2d -v
          python -m unittest ntr.nerva.validate_stage52_fuel_sector_conduction_2d -v
          python -m ntr.nerva.validate_fuel_sector_geometry
      - name: Print exact native-format metadata recovered from HDF5 fixture
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from ntr.nerva.validate_stage60_native_hdf5_heating import synthetic_statepoint,FUEL_ID,DATA_SHA
          from ntr.nerva.openmc_native_fuel_statepoint import read_openmc_neutron_fuel_statepoint
          with tempfile.TemporaryDirectory() as root:
              path=Path(root)/'statepoint.10.h5'
              synthetic_statepoint(path,n=8)
              r=read_openmc_neutron_fuel_statepoint(
                  path,expected_fuel_material_id=FUEL_ID,
                  nuclear_data_sha256=DATA_SHA,
                  source_rate_particles_per_s=1e18,
                  source_rate_basis='SYNTHETIC normalization for numerical tests',
                  photon_transport_confirmed_disabled=True)
              print('Stage63 native OpenMC [major,minor] version:',r.statepoint_format_version)
              print('Stage63 native energy mode:',r.energy_mode)
              print('Stage63 planned and current batches:',r.n_batches,r.current_batch)
              print('Stage63 active tally realizations:',r.active_realizations)
              print('Stage63 neutron-only mode verified:',r.photon_transport_verified_disabled)
              print('Stage63 fixtures SYNTHETIC, not genuine OpenMC transport physics')
              assert r.statepoint_format_version==(18,2)
          PY
