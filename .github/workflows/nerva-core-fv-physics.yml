name: NERVA core finite-volume physics numerical checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ntr/nerva/core_conjugate_fv.py'
      - 'ntr/nerva/core_hex_lateral_fv.py'
      - 'ntr/nerva/core_hex_lateral_balance.py'
      - 'ntr/nerva/run_core_hex_lateral_fv.py'
      - 'ntr/nerva/validate_core_hex_lateral_fv.py'
      - 'ntr/nerva/core_conjugate_fv_diagnostics.py'
      - 'ntr/nerva/validate_core_conjugate_fv.py'
      - 'ntr/nerva/run_core_conjugate_fv.py'
      - '.github/workflows/nerva-core-fv-physics.yml'
  push:
    branches: [main]
    paths:
      - 'ntr/nerva/core_conjugate_fv.py'
      - 'ntr/nerva/core_hex_lateral_fv.py'
      - 'ntr/nerva/core_hex_lateral_balance.py'
      - 'ntr/nerva/run_core_hex_lateral_fv.py'
      - 'ntr/nerva/validate_core_hex_lateral_fv.py'
      - 'ntr/nerva/core_conjugate_fv_diagnostics.py'
      - 'ntr/nerva/validate_core_conjugate_fv.py'
      - 'ntr/nerva/run_core_conjugate_fv.py'
      - '.github/workflows/nerva-core-fv-physics.yml'

permissions:
  contents: read

jobs:
  core-fv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install finite-volume runtime dependencies
        run: python -m pip install "numpy>=1.26" "scipy>=1.12"
      - name: Check analytical radial benchmark, first law, transient and interface resistance
        run: python -m ntr.nerva.validate_core_conjugate_fv
      - name: Check lateral 19-channel Voronoi core conduction physics
        run: python -m ntr.nerva.validate_core_hex_lateral_fv
      - name: Check executable interfaces
        run: |
          python -m ntr.nerva.run_core_conjugate_fv --help
          python -m ntr.nerva.run_core_hex_lateral_fv --help
