name: FX2-TH complete delayed-family fission eigen physics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_full_family_fission_eigen.py'
      - 'ntr/nerva/validate_fx2th_full_family_fission_eigen.py'
      - '.github/workflows/fx2th-family-fission-eigen.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_full_family_fission_eigen.py'
      - 'ntr/nerva/validate_fx2th_full_family_fission_eigen.py'
      - '.github/workflows/fx2th-family-fission-eigen.yml'

permissions:
  contents: read

jobs:
  independent-family-eigen-and-kinetics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Verify original cylindrical diffusion regressions
        run: python -m ntr.nerva.validate_fx2th_rz_family_diffusion
      - name: Verify distinct delayed-family birth energy fission eigenproblem
        run: python -m ntr.nerva.validate_fx2th_full_family_fission_eigen
