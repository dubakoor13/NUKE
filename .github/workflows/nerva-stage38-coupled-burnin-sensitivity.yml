name: NUKE Stage38 genuine coupled OpenMC 20 vs 40 inactive generation physics

on:
  pull_request:
    paths:
      - 'ntr/nerva/real_coupled_burnin_sensitivity.py'
      - 'ntr/nerva/validate_stage38_coupled_burnin.py'
      - '.github/workflows/nerva-stage38-coupled-burnin-sensitivity.yml'
  push:
    paths:
      - 'ntr/nerva/real_coupled_burnin_sensitivity.py'
      - 'ntr/nerva/validate_stage38_coupled_burnin.py'
      - '.github/workflows/nerva-stage38-coupled-burnin-sensitivity.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  original-openmc-identical-transport-20-vs-40-inactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover actual Stage37 full original neutron photon source histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/stage38_reference build/stage38_candidate build/stage38_results
          gh run download 40747291683 -R "$GITHUB_REPOSITORY" \
            -n nuke-stage37-original-broad-vs-compact-neutron-photon-hdf5 \
            -D build/stage38_reference
          for mode in legacy-broad central-compact; do
            for seed in 13007 23011; do
              test -s "build/stage38_reference/$mode/seed_$seed/transport_provenance.json"
              test -s "build/stage38_reference/$mode/seed_$seed/statepoint.060.h5"
              test -s "build/stage38_reference/$mode/seed_$seed/statepoint.100.h5"
            done
          done
      - name: Pin official evaluated-data OpenMC neutron photon transport
        run: |
          set -euo pipefail
          docker pull openmc/openmc:v0.15.3
          docker image inspect openmc/openmc:v0.15.3 \
            --format '{{json .RepoDigests}}' > build/stage38_candidate/openmc_image_repo_digest.json
      - name: Run same original neutron source histories with 40 inactive not 20
        run: |
          docker run --rm --cpus=2 --memory=6g -e OMP_NUM_THREADS=2 \
            -v "$GITHUB_WORKSPACE:/repo" -w /tmp \
            openmc/openmc:v0.15.3 \
            bash -lc '
              set -euo pipefail
              export PYTHONPATH="$(python -c "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])"):/repo"
              python -c "import openmc; assert not openmc.__file__.startswith(\"/repo/\")"
              test -s "$OPENMC_CROSS_SECTIONS"
              openmc --version
              python -m unittest ntr.nerva.validate_stage38_coupled_burnin.BurninMathTests -v
              for mode in legacy-broad central-compact; do
                for seed in 13007 23011; do
                  echo "REAL coupled OpenMC burn-in=40 mode=$mode seed=$seed"
                  python -m ntr.nerva.run_openmc_transport \
                    --cross-sections "$OPENMC_CROSS_SECTIONS" \
                    --assembly core --rings 3 \
                    --particles 3000 --batches 100 --inactive 40 \
                    --statepoint-batches 60 100 --seed "$seed" \
                    --initial-fission-source "$mode" \
                    --hydrogen-temperature-k 293.6059129982851 \
                    --photon-transport \
                    --heating-mesh-dimensions 12 12 10 \
                    --diagnostic-energy-groups 24 --axial-mesh-bins 24 \
                    --output "/repo/build/stage38_candidate/$mode/seed_$seed"
                  test -s "/repo/build/stage38_candidate/$mode/seed_$seed/statepoint.060.h5"
                  test -s "/repo/build/stage38_candidate/$mode/seed_$seed/statepoint.100.h5"
                done
              done
              python -m ntr.nerva.real_coupled_burnin_sensitivity \
                --original-stage37-root /repo/build/stage38_reference \
                --new-40-inactive-root /repo/build/stage38_candidate \
                --output /repo/build/stage38_results/actual_burnin_20_vs_40_coupled.json
              NUKE_STAGE38_ORIGINAL_STAGE37_HDF5_ROOT=/repo/build/stage38_reference \
                NUKE_STAGE38_REAL_40_INACTIVE_HDF5_ROOT=/repo/build/stage38_candidate \
                python -m unittest ntr.nerva.validate_stage38_coupled_burnin.ActualOpenMCCoupledBurninTests -v
              test -s /repo/build/stage38_results/actual_burnin_20_vs_40_coupled.json
              python -c "import json; r=json.load(open(\"/repo/build/stage38_results/actual_burnin_20_vs_40_coupled.json\")); assert r[\"original_native_hdf5_count\"]==16 and r[\"same_actual_neutron_transport_trajectories_verified\"] and not r[\"qualified_original_hot_nerva_reactor_power_watts\"]; print(\"Native independent burn-in threshold physics QA ACCEPTED\")"
            '
      - name: Preserve new real neutron photon StatePoints, material and XML fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage38-original-40inactive-neutron-photon-hdf5
          path: |
            build/stage38_candidate/openmc_image_repo_digest.json
            build/stage38_candidate/*/seed_*/*.json
            build/stage38_candidate/*/seed_*/*.xml
            build/stage38_candidate/*/seed_*/statepoint.060.h5
            build/stage38_candidate/*/seed_*/statepoint.100.h5
          retention-days: 21
          if-no-files-found: warn
      - name: Retain original per-voxel burn-in sensitivity energy and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage38-original-20vs40-burnin-heating-physics
          path: build/stage38_results/*.json
          retention-days: 21
          if-no-files-found: warn
