name: NUKE Stage28 genuine neutron-only heating anti-promotion

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_openmc_statepoint_heating.py'
      - 'ntr/nerva/validate_fx2th_openmc_statepoint_heating.py'
      - 'ntr/nerva/audit_original_neutron_only_thermal_gate.py'
      - 'ntr/nerva/validate_stage28_original_neutron_only_heating.py'
      - '.github/workflows/nerva-stage28-real-heating-gate.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_openmc_statepoint_heating.py'
      - 'ntr/nerva/validate_fx2th_openmc_statepoint_heating.py'
      - 'ntr/nerva/audit_original_neutron_only_thermal_gate.py'
      - 'ntr/nerva/validate_stage28_original_neutron_only_heating.py'
      - '.github/workflows/nerva-stage28-real-heating-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  genuine-cold-hdf5-heating-mode-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific HDF5/numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.12' 'h5py>=3.10'
      - name: Validate Stage 10 heating adapter including Stage 28 anti-promotion
        run: python -m unittest ntr.nerva.validate_fx2th_openmc_statepoint_heating -v
      - name: Fetch ORIGINAL four-seed OpenMC 0.15.3 neutron-only archive
        uses: actions/download-artifact@v4
        with:
          repository: dubakoor13/NUKE
          run-id: 39933618638
          name: nerva-real-openmc-four-seed-core-evidence
          github-token: ${{ github.token }}
          path: build/original
      - name: Require real native HDF5 source and previous full neutron ledger
        run: |
          for seed in 13007 23011 33013 43019; do
            test -s "build/original/seed_$seed/statepoint.120.h5"
          done
          test -s build/original/heating_data_qualification.json
      - name: Verify real partial heating cannot be accepted as total core power
        run: |
          python -m ntr.nerva.audit_original_neutron_only_thermal_gate build/original \
            --output build/stage28_actual_heating_mode_gate.json
      - name: Execute tests on ORIGINAL four neutron transport HDF5 binaries
        env:
          NUKE_REAL_CORE_EVIDENCE_PATH: build/original
        run: python -m unittest ntr.nerva.validate_stage28_original_neutron_only_heating -v
      - name: Retain real evidence and blocked physics gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuke-stage28-original-neutron-only-heating-gate
          path: build/stage28_actual_heating_mode_gate.json
          if-no-files-found: warn
