name: FX2-TH spatial temperature nuclear-data interpolation

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_rz_temperature_tables.py'
      - 'ntr/nerva/validate_fx2th_rz_temperature_tables.py'
      - '.github/workflows/fx2th-rz-temperature-tables.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_rz_temperature_tables.py'
      - 'ntr/nerva/validate_fx2th_rz_temperature_tables.py'
      - '.github/workflows/fx2th-rz-temperature-tables.yml'

permissions:
  contents: read

jobs:
  independently-checked-material-interpolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Existing verified adjoint and family physics regression
        run: python -m ntr.nerva.validate_fx2th_rz_adjoint_sensitivity
      - name: Temperature-indexed multigroup material sampling and adjoint verification
        run: python -m ntr.nerva.validate_fx2th_rz_temperature_tables
