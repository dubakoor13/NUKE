name: FX2-TH spatial delayed-family kinetics

on:
  push:
    paths:
      - 'ntr/nerva/fx2th_family_spacetime.py'
      - 'ntr/nerva/validate_fx2th_family_spacetime.py'
      - '.github/workflows/fx2th-spatial-family.yml'
  pull_request:
    paths:
      - 'ntr/nerva/fx2th_family_spacetime.py'
      - 'ntr/nerva/validate_fx2th_family_spacetime.py'
      - '.github/workflows/fx2th-spatial-family.yml'

permissions:
  contents: read

jobs:
  spatial-family-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11'
      - name: Validate underlying stage 6 family source and spectra
        run: python -m ntr.nerva.validate_delayed_family_contract
      - name: Validate transient spatial delayed precursor families
        run: python -m ntr.nerva.validate_fx2th_family_spacetime
